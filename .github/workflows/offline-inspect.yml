name: Inspect offline payload evidence
on:
  push:
    branches: [build/offline-benchmarks-20261023]
    paths: [.github/workflows/offline-inspect.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read retained small inspection archive
        env:
          TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,os,zipfile,io
          class NR(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          url='https://api.github.com/repos/kogamishinyajerry-ops/comacbench/actions/artifacts/12493415435/zip'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['TOKEN'],'User-Agent':'offline-inspect'})
          try: r=urllib.request.build_opener(NR()).open(req,timeout=60)
          except urllib.error.HTTPError as e:
              assert e.code==302
              r=urllib.request.urlopen(e.headers['Location'],timeout=60)
          z=zipfile.ZipFile(io.BytesIO(r.read()))
          for n in z.namelist():
              if n.endswith(('simulcost-3-solvers.log','reload-selftest.log','build-config.json')):
                  print('\n=== '+n+' ===\n'+z.read(n).decode('utf8',errors='replace')[-12000:])
          PY
