name: Workbench and product scope

"on":
  pull_request:
    paths:
      - 'comacbench/**'
      - 'scripts/**'
      - 'tests/test_workbench*.py'
      - 'tests/test_campaign_checkout.py'
      - 'examples/workbench/**'
      - 'registry/product-scope.json'
      - 'registry/registry.yaml'
      - 'packs/**'
      - '.github/workflows/campaign-audit.yml'
      - '.github/workflows/workbench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench:
    name: Workbench / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, pinned
        with:
          python-version: ${{ matrix.python }}
      - name: Export pinned source trees without worktree
        # Sparse checkout still validated colon-bearing research paths on Windows.
        # Export ONLY these trees from a bare fetch; do not disable protectNTFS.
        # This is scoped source CI, not wheel/full-repository acceptance.
        shell: python
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}.git
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # BEGIN_SOURCE_EXPORT
          import os, re, subprocess, tarfile, tempfile
          from contextlib import ExitStack
          from pathlib import Path, PurePosixPath
          sha = os.environ['SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise ValueError('expected exact source commit')
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          workspace.mkdir(parents=True, exist_ok=True)
          selected = ('comacbench', 'scripts', 'tests', '.github/workflows', 'examples/workbench', 'registry', 'packs')
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as temp:
              bare = Path(temp)/'source.git'
              def git(*args):
                  return subprocess.check_output(['git', '-C', str(bare), *args], text=True).strip()
              subprocess.run(['git', 'init', '--bare', str(bare)], check=True)
              git('remote', 'add', 'origin', os.environ['SOURCE_URL'])
              git('-c', 'protocol.version=2', 'fetch', '--no-tags', '--depth=1', '--filter=blob:none', 'origin', sha)
              if git('rev-parse', 'FETCH_HEAD') != sha:
                  raise ValueError('source identity mismatch')
              # Archiving the commit with pathspecs still unpacks its root tree
              # on Git for Windows. Anchor each selected TREE to the exact commit
              # and archive that object, never the root containing research paths.
              with ExitStack() as stack:
                  exports, total_members, total_bytes = [], 0, 0
                  for i, selection in enumerate(selected):
                      tree = git('rev-parse', f'{sha}:{selection}')
                      if not re.fullmatch(r'[0-9a-f]{40}', tree) or git('cat-file', '-t', tree) != 'tree':
                          raise ValueError('expected source subtree: ' + selection)
                      bundle = Path(temp)/f'source-{i}.tar'
                      git('archive', '--format=tar', f'--prefix={selection}/', f'--output={bundle}', tree)
                      archive = stack.enter_context(tarfile.open(bundle))
                      members = archive.getmembers()
                      total_members += len(members)
                      total_bytes += sum(m.size for m in members)
                      if total_members > 50000 or total_bytes > 128*1024*1024:
                          raise ValueError('source archive exceeds scope')
                      for member in members:
                          path, scope = PurePosixPath(member.name), PurePosixPath(selection)
                          allowed = path == scope or path.is_relative_to(scope) or scope.is_relative_to(path)
                          if (not allowed or path.is_absolute() or '..' in path.parts
                                  or ':' in member.name or '\\' in member.name
                                  or not (member.isfile() or member.isdir())):
                              raise ValueError('unsafe source member: ' + member.name)
                      exports.append((archive, members))
                  # Validate all selected trees before materializing any source.
                  for archive, members in exports:
                      archive.extractall(workspace, members=members, filter='data')
          for required in ('comacbench/workbench.py', 'scripts/dsh_public_boundary.mjs', 'tests/test_workbench.py', 'registry/product-scope.json', 'examples/workbench/workload-change-v1.json'):
              if not (workspace/required).is_file():
                  raise ValueError('required source missing: ' + required)
          print('Workbench source snapshot:', sha)
          # END_SOURCE_EXPORT
      - name: Install existing YAML dependency for catalog checks
        run: python -m pip install "PyYAML==6.0.2"
      - name: Test environment, independent review, source export and catalog
        run: python -m unittest discover -s tests -p "test_workbench*.py" -v
      - name: Validate actual product paths and registry IDs
        run: python -m comacbench.catalog --check
      - name: Run complete public reference and two negative controls
        run: |
          python examples/workbench/reference_policy.py --out ./workbench-reference
          python examples/workbench/reference_policy.py --negative stale --out ./workbench-stale
          python examples/workbench/reference_policy.py --negative false-ready --out ./workbench-false-ready
      - name: Compile source modules
        run: python -m compileall -q comacbench
