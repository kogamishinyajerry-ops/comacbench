name: SimulCost verified offline delivery
on:
  push:
    branches: [build/offline-benchmarks-20261023]
    paths: [.github/workflows/offline-simulcost-delivery.yml]
permissions:
  contents: read
  actions: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Build bounded numerical smoke and complete offline installer validation
        env:
          PROJECT: simulcost
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import urllib.request
          url='https://raw.githubusercontent.com/kogamishinyajerry-ops/comacbench/b92928721297a33e37215f6bc139f0707025cb61/tools/package_offline_release.py'
          with urllib.request.urlopen(url,timeout=60) as r: script=r.read().decode()
          correction=r'''
          shutil.copyfile(B/'evidence/build-config.json',B/'evidence/initial-build-config.json')
          cmd(['docker','load','--input',B/'images.tar.gz'])
          old=config['images'][0]['tag']
          fix=ROOT/'numeric-fix'; fix.mkdir()
          hook="import os\nif os.environ.get('COMAC_NUMERIC_ONLY')=='1':\n import matplotlib.pyplot as plt\n plt.savefig=lambda *a,**k: None\n plt.tight_layout=lambda *a,**k: None\n"
          (fix/'sitecustomize.py').write_text(hook)
          smoke="""import json,pathlib,subprocess,sys
          import h5py,numpy as np
          out=pathlib.Path('/work');out.mkdir(exist_ok=True)
          results=[]
          for family,frames,extra in [('heat_1d',25,[]),('burgers_1d',11,[]),('diff_react_1d',3,['record_dt=1.0','end_frame=2'])]:
              args=[sys.executable,'costsci_tools/runners/'+family+'.py','--config-name=p1','n_space=64','cfl=0.25','dump_dir=/work/'+family,'+max_wall_time=90']+extra
              subprocess.run(args,check=True,timeout=120)
              dirs=list(out.glob(family+'*'));files=[p for d in dirs for p in d.glob('*.h5')]
              assert len(files)==frames,(family,len(files),frames)
              for f in files:
                  numeric=0
                  with h5py.File(f) as h:
                      for k in h:
                          if np.issubdtype(h[k].dtype,np.number):
                              numeric+=1;assert np.isfinite(h[k][...]).all(),(f,k)
                          else:
                              assert family=='diff_react_1d' and k in {'reaction_type','reaction_formula'},(f,k)
                              assert h[k][()],(f,k,'empty metadata')
                      assert numeric>=2,(f,'missing numeric fields')
                      if family=='diff_react_1d':assert {'x','u','time'}<=set(h)
              metas=[json.loads(p.read_text()) for d in dirs for p in d.glob('meta.json')]
              assert metas and all(m['cost']>0 for m in metas)
              if family=='diff_react_1d':assert all(m['final_time']==2.0 for m in metas)
              results.append({'family':family,'frames':len(files),'meta':metas,'config_overrides':extra,'role':'installation smoke, not benchmark or model score'})
          (out/'smoke.json').write_text(json.dumps(results,indent=2));print(json.dumps(results))
          """
          compile(smoke,'smoke.py','exec')
          (fix/'smoke.py').write_text(smoke)
          (fix/'Dockerfile').write_text('FROM '+old+'\nCOPY sitecustomize.py smoke.py /opt/offline/\n')
          new='comac-offline/simulcost:72c7c4a-cpu4'
          cmd(['docker','build','--network=none','-t',new,fix])
          info=json.loads(capture(['docker','image','inspect',new]))[0]
          out=ROOT/'fixed-numeric-smoke';out.mkdir()
          log=B/'evidence/numeric-mode-corrected.log'
          with log.open('w') as f:
              result=subprocess.run(['docker','run','--rm','--network=none','--memory=4g','--cpus=2','-v',str(out)+':/work',new,'python','/opt/offline/smoke.py'],stdout=f,stderr=subprocess.STDOUT,timeout=600)
          print('CORRECTED_SMOKE_EXIT',result.returncode,flush=True)
          print(log.read_text()[-12000:],flush=True)
          assert result.returncode==0,'Corrected installation smoke failed'
          config['superseded_build_tests']=config['tests']
          config['tests']=[t for t in config['tests'] if t['name']!='simulcost-3-solvers']+[{'name':'simulcost-installation-smoke-three-solvers','status':'PASS','returncode':0,'network':'none','model_calls':0,'expected_frames':{'heat_1d':25,'burgers_1d':11,'diff_react_1d':3},'diffusion_horizon':'record_dt=1/end_frame=2; original full horizon NOT verified'}]
          config['images']=[{'tag':new,'id':info['Id'],'architecture':info['Architecture'],'os':info['Os'],'size':info['Size']}]
          config['deployment_patch']='Numerical-only plotting hooks; smoke validates numeric fields and known text metadata; shortened diffusion horizon only for installation. Solver and scoring source unchanged.'
          (B/'evidence/build-config.json').write_text(json.dumps(config,indent=2)+'\n')
          (B/'images.tsv').write_text(new+'\t'+info['Id']+'\n')
          (B/'build-context/sitecustomize.py').write_text(hook)
          (B/'build-context/smoke.py').write_text(smoke)
          shutil.copytree(fix,B/'deployment-patches/numeric-mode')
          shutil.copytree(out,B/'evidence/corrected-numeric-output')
          with (B/'images.tar.gz').open('wb') as f:
              save=subprocess.Popen(['docker','save',new],stdout=subprocess.PIPE)
              gz=subprocess.run(['gzip','-1'],stdin=save.stdout,stdout=f);save.stdout.close()
              assert save.wait()==0 and gz.returncode==0
          shutil.copyfile(B/'payload-status.json',B/'evidence/initial-payload-status.json')
          (B/'payload-status.json').write_text(json.dumps({'project':'simulcost','packaged':True,'tests_pass':True,'model_calls':0,'initial_failure_retained':True,'full_diffusion_task_verified':False},indent=2))
          '''
          marker="config=json.loads((B/'evidence/build-config.json').read_text())"
          assert script.count(marker)==1
          script=script.replace(marker,marker+'\n'+correction)
          script=script.replace('数值模式保留 HDF5/JSON','安装自检的扩散反应采用 record_dt=1/end_frame=2 的短时配置；完整时域在首次90秒限时内未完成，不能按完整任务通过。数值模式保留 HDF5/JSON')
          exec(compile(script,'package_offline_simulcost.py','exec'))
          PY
      - name: Upload final independent SimulCost package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: COMAC-SimulCost-Offline-Verified
          path: release/
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn
      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inspect-simulcost-verified
          path: |
            release/DELIVERY.json
            COMAC-simulcost-offline-linux-amd64/evidence/*.json
            COMAC-simulcost-offline-linux-amd64/evidence/*.log
          compression-level: 6
          retention-days: 30
          if-no-files-found: warn
