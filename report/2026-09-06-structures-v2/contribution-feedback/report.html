<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>航空工程 Agent 评测报告 · COMACBench</title>
<style>
:root{color-scheme:dark;--bg:#0c141d;--panel:#14212d;--line:#293d4c;--muted:#a3b5c1;--cyan:#61ddd2;--amber:#f3be75;--red:#ff8999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eff7fa;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1180px;margin:auto;padding:40px 30px 80px}.brand{color:var(--cyan);letter-spacing:.18em;font-size:12px}h1{font-size:32px;line-height:1.3;margin:20px 0 12px}h2{font-size:20px;margin:28px 0 12px}p{margin:6px 0;color:var(--muted)}.hero{display:flex;justify-content:space-between;gap:30px;border-bottom:1px solid var(--line);padding-bottom:26px}.stamp{min-width:170px;padding:15px;border-left:3px solid var(--cyan);align-self:center}.stamp strong{display:block;font-size:20px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.stat{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.stat b{display:block;font-size:34px}.flow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;color:var(--muted)}.flow span{padding:7px 14px;background:var(--panel);border-radius:6px}.flow .on{color:var(--cyan);border:1px solid #36706e}.notice{padding:14px 18px;border-left:3px solid var(--amber);background:#27251f;color:#f1d7b0;margin:20px 0}.family{display:grid;grid-template-columns:170px 1fr 90px;align-items:center;gap:20px;padding:12px 0}.track{height:12px;background:#263747;border-radius:12px;overflow:hidden}.fill{height:100%;background:var(--cyan)}button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--cyan)}.toolbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:18px 0}.pills{display:flex;gap:8px;flex-wrap:wrap}.pills button.on{color:var(--cyan);border-color:var(--cyan)}.task{border:1px solid var(--line);border-radius:10px;margin:12px 0;background:var(--panel);overflow:hidden}summary{padding:18px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}summary small{color:var(--muted)}.detail{padding:0 18px 18px}.tag{display:inline-block;padding:2px 9px;border-radius:5px;background:#243b43;color:var(--cyan);font-size:12px}.bad{color:var(--red)}.warn{color:var(--amber)}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}th{color:var(--muted);font-weight:500}pre{overflow:auto;white-space:pre-wrap;word-break:break-word;background:#0d1822;border:1px solid var(--line);padding:14px;border-radius:6px;font-size:12px}code{font-family:ui-monospace,monospace}.issue{display:grid;grid-template-columns:100px 1fr;gap:16px;border-bottom:1px solid var(--line);padding:16px 0}.issue small{word-break:break-all;color:var(--muted)}.issue p{color:#d7e4ea}.footer{margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}@media(max-width:650px){main{padding:24px 16px}.hero{display:block}.stamp{margin-top:20px}.stats{grid-template-columns:1fr}.family{grid-template-columns:130px 1fr 60px;gap:8px}h1{font-size:26px}.toolbar{align-items:flex-start;flex-direction:column}.issue{grid-template-columns:70px 1fr}}
</style>
<main><div class="brand">COMACBENCH / ENGINEERING AGENT EVALUATION</div><div class="hero"><div><h1 id="title"></h1><p id="description"></p><p id="revision"></p></div><div class="stamp"><span class="muted">本次证据性质</span><strong id="mode"></strong><span id="agent" class="muted"></span></div></div>
<div class="flow"><span class="on">① 检查评测材料</span>→<span id="step2">② 接入并运行 agent</span>→<span id="step3">③ 查看结果与缺口</span></div>
<div class="notice" id="boundary"></div><div class="stats" id="stats"></div>
<section id="coverage"><h2>这次验证了哪些能力</h2><p>按任务族查看“全部检查通过”的任务数。不同能力不合成模型排名。</p><div id="families"></div></section>
<div class="toolbar"><h2>逐题结果</h2><div class="pills" id="filters"></div></div><div id="tasks"></div>
<div class="toolbar"><h2>评测集质量反馈</h2><select id="severity" aria-label="筛选问题严重程度"><option value="all">全部问题</option><option value="blocker">阻断运行</option><option value="review">需人工审查</option></select></div><p>给出材料位置、发现的问题和补齐方式；检查通过不等于已批准发布。</p><div id="issues"></div>
<section id="calibration"></section><section id="reproduce"></section><div class="footer"><p>本报告可离线打开。实际判分来自 COMACBench adapter；完整证据保留在同目录 JSON 和运行档案中。</p></div></main>
<script id="data" type="application/json">{"validation": {"protocol": "comacbench.pack.v1", "pack": {"id": "aviation-structures-v2", "title": "结构仿真 Agent · 工程输入检查", "revision": "2.0.0", "description": "C3D20 静力悬臂梁：连接、网格、材料、边界、载荷、输出六项输入检查，加原生求解与参考数值验证。", "source": "JerryDSH-COMACBench 自建；结构题由 ccx_cb_01 独立复制并锁定，不修改原题", "license": "自建示例：企业数据/本体 CC0-1.0；结构题沿用仓库自建任务许可记录"}, "runnable": false, "publishable": false, "task_count": 1, "tasks": [{"id": "beam_static_01", "suite": "aviation.structures", "family": "industrial_simulation", "path": "tasks/aviation.structures/beam_static_01.yaml", "adapter": "simulation_agent", "evidence_level": "solver_execution"}], "issues": [{"code": "missing_file", "severity": "blocker", "field": "input.prompt_file", "message": "材料不可读取：tasks/aviation.structures/beam_static_01.md", "suggested_fix": "补齐包内文件；使用相对路径，不使用符号链接。", "task_id": "beam_static_01"}, {"code": "invalid_tolerance", "severity": "blocker", "field": "tasks/aviation.structures/beam_static_01.yaml:grader.numeric_rel_tol", "message": "相对容差无效或宽到不能判别。", "suggested_fix": "提供 0 到 1 之间、带依据的容差。", "task_id": "beam_static_01"}, {"code": "invalid_deck_contract", "severity": "blocker", "field": "tasks/aviation.structures/beam_static_01.yaml:grader.deck_contract.material", "message": "材料需完整声明弹性模量 MPa、泊松比和密度 tonne/mm³。", "suggested_fix": "补齐 profile 声明的完整参数，不得以空值或未知字段关闭检查。", "task_id": "beam_static_01"}, {"code": "bounded_engineering_profile", "severity": "review", "field": "tasks/aviation.structures/beam_static_01.yaml:grader.deck_contract", "message": "已接入结构化静力梁六项输入检查；仍需审查参考值、离散误差与题面语义。", "suggested_fix": "完成正负例校准及工程专家审查；此检查不代表复杂结构或飞机级接受。", "task_id": "beam_static_01"}, {"code": "unknown_check", "severity": "blocker", "field": "tasks/aviation.structures/beam_static_01.yaml:evaluation.requirements", "message": "结构检查引用缺少可用契约或检查项不存在。", "suggested_fix": "使用有效 deck_contract 及已实现的 deck: 检查 ID。", "task_id": "beam_static_01"}, {"code": "unknown_check", "severity": "blocker", "field": "tasks/aviation.structures/beam_static_01.yaml:evaluation.requirements", "message": "结构检查引用缺少可用契约或检查项不存在。", "suggested_fix": "使用有效 deck_contract 及已实现的 deck: 检查 ID。", "task_id": "beam_static_01"}, {"code": "unknown_check", "severity": "blocker", "field": "tasks/aviation.structures/beam_static_01.yaml:evaluation.requirements", "message": "结构检查引用缺少可用契约或检查项不存在。", "suggested_fix": "使用有效 deck_contract 及已实现的 deck: 检查 ID。", "task_id": "beam_static_01"}, {"code": "unknown_check", "severity": "blocker", "field": "tasks/aviation.structures/beam_static_01.yaml:evaluation.requirements", "message": "结构检查引用缺少可用契约或检查项不存在。", "suggested_fix": "使用有效 deck_contract 及已实现的 deck: 检查 ID。", "task_id": "beam_static_01"}, {"code": "unknown_check", "severity": "blocker", "field": "tasks/aviation.structures/beam_static_01.yaml:evaluation.requirements", "message": "结构检查引用缺少可用契约或检查项不存在。", "suggested_fix": "使用有效 deck_contract 及已实现的 deck: 检查 ID。", "task_id": "beam_static_01"}, {"code": "unknown_check", "severity": "blocker", "field": "tasks/aviation.structures/beam_static_01.yaml:evaluation.requirements", "message": "结构检查引用缺少可用契约或检查项不存在。", "suggested_fix": "使用有效 deck_contract 及已实现的 deck: 检查 ID。", "task_id": "beam_static_01"}, {"code": "expert_review_required", "severity": "review", "field": "pack", "message": "静态检查不证明题意、工程真值与判分语义一致；当前包未完成发布审查。", "suggested_fix": "校准参考实现和错误负例，再进行工程专家审查。", "task_id": null}], "summary": {"blocker": 9, "review": 2, "warning": 0}}, "pack": {"id": "aviation-structures-v2", "title": "结构仿真 Agent · 工程输入检查", "revision": "2.0.0", "description": "C3D20 静力悬臂梁：连接、网格、材料、边界、载荷、输出六项输入检查，加原生求解与参考数值验证。", "source": "JerryDSH-COMACBench 自建；结构题由 ccx_cb_01 独立复制并锁定，不修改原题", "license": "自建示例：企业数据/本体 CC0-1.0；结构题沿用仓库自建任务许可记录"}, "mode": "validation", "results": []}</script>
<script>
const d=JSON.parse(document.getElementById('data').textContent),v=d.validation,rows=d.results||[];
const names={industrial_simulation:'工业仿真',enterprise_data:'企业数据处理',knowledge_ontology:'知识本体'};
const el=id=>document.getElementById(id),text=(tag,s,cls)=>{const n=document.createElement(tag);n.textContent=s;if(cls)n.className=cls;return n};
el('title').textContent=d.pack?.title||'评测包材料检查';el('description').textContent=d.pack?.description||'修复下方问题后再次检查';el('revision').textContent=`${d.pack?.id||'未命名'} · 修订 ${d.pack?.revision||'未声明'}`;
el('mode').textContent=d.agent?.agent_kind==='recorded_replay'?'冻结答案离线回放':d.mode==='calibrate'?'判分管线自检':d.mode==='validation'?'贡献材料预检':d.agent?.agent_kind==='reference_fixture'?'参考 agent 接口验证':'工程师 agent 评测';
el('agent').textContent=d.agent?.model||d.agent?.name||'未调用 agent';
el('boundary').textContent=d.status==='interrupted'?`运行中断：${d.error}。已完成结果保留，修复环境后按相同身份续跑。`:!v.runnable?'材料检查存在阻断项。补齐下方材料后才能调用 agent。':v.issues.some(i=>i.code==='partial_engineering_gate')?'本包存在尚未独立核验的网格、边界和材料要求；详见下方质量反馈。结果不能替代工程接受或构成通用模型排名。':'本次检查范围以逐题契约为准。静力梁已接入六项工程输入检查；参考值、离散误差和工程适用性仍需审查。离线回放不代表重新调用模型，校准不计入模型排名。';
const stat=(n,label)=>{const x=text('div','', 'stat');x.append(text('b',n),text('span',label,'muted'));return x};
el('stats').append(stat(`${rows.filter(r=>r.full_pass).length} / ${rows.length}`, '全部检查通过 / 已完成任务'),stat(v.summary.blocker,'材料阻断项'),stat(v.summary.review,'需要审查的问题'));
if(rows.length)el('step3').className='on';
for(const [family,name] of Object.entries(names)){if(!v.tasks.some(t=>t.family===family))continue;const a=rows.filter(r=>r.family===family),total=v.tasks.filter(t=>t.family===family).length,ok=a.filter(r=>r.full_pass).length;const line=text('div','', 'family'),bar=text('div','', 'track'),fill=text('div','', 'fill');fill.style.width=(total?100*ok/total:0)+'%';bar.append(fill);line.append(text('span',name),bar,text('span',`${ok} / ${total}`));el('families').append(line)}
const checkNames={connectivity:'节点连接',mesh:'几何与网格',material:'材料分配',boundary:'根部约束',load:'载荷分配',output:'输出请求'};
function renderAudit(body,audit){if(!audit)return;body.append(text('h3','工程输入检查'),text('p',audit.passed?'六项输入契约通过；求解和数值判分结果见本题证据。':'输入未满足契约，求解器未启动。按问题定位修复后建立新运行。',audit.passed?'':'warn'));const list=text('div','','pills');for(const [id,name] of Object.entries(checkNames)){const status=audit.checks.find(c=>c.id===id)?.status;list.append(text('span',`${name} · ${status==='pass'?'通过':status==='fail'?'未通过':'未检查'}`,status==='pass'?'tag':'tag warn'))}body.append(list);for(const i of audit.issues){const box=text('div','','notice');box.append(text('strong',i.message),text('p',i.suggested_fix),text('small',`${i.code}${i.line?' · model.inp 第 '+i.line+' 行':''}`));if(i.details?.node_ids)box.append(text('p',`节点编号：${i.details.node_ids.slice(0,20).join(', ')}${i.details.node_ids.length>20?' …':''}`));if(i.details?.source_lines)box.append(text('p',`载荷数据行：${i.details.source_lines.slice(0,20).join(', ')}`));body.append(box)}}
function renderTasks(filter='all'){el('tasks').replaceChildren();const selected=rows.filter(r=>filter==='all'||filter==='failed'&&!r.full_pass||r.family===filter);if(!selected.length)el('tasks').append(text('p',rows.length?'此筛选下没有任务。':'尚未执行任务。先修复材料阻断项，再运行 agent 或校准判分。'));for(const r of selected){const box=text('details','', 'task'),s=text('summary',''),left=text('div','');left.append(text('strong',r.id),text('small',`　${names[r.family]}　`),text('span',r.evidence_level==='solver_executed'?'实际求解':r.evidence_level==='executable_checks'?'可执行检查':r.evidence_level==='input_audit'?'输入契约审查':'未完成执行','tag'));s.append(left,text('strong',r.full_pass?'全部通过':`存在缺口 · ${Math.round((r.score||0)*100)} 分`,r.full_pass?'':'warn'));const body=text('div','', 'detail');body.append(text('p',r.scope));const table=document.createElement('table');for(const q of r.requirements||[]){const tr=document.createElement('tr');tr.append(text('td',q.text),text('td',q.check==='not_covered'?'未覆盖，不能宣称通过':`检查位置：${q.check}`,q.check==='not_covered'?'warn':''));table.append(tr)}body.append(table,text('p',`有效性门：${r.validity_gate===1?'通过':'未通过'}；失败原因：${(r.gate_failures||[]).join(', ')||'无'}`));renderAudit(body,r.details?.deck_audit);const detail=text('details','');detail.append(text('summary','查看判分数值与证据路径'),text('pre',JSON.stringify({details:r.details,result_file:r.result_file,result_sha256:r.result_sha256},null,2)));body.append(detail);box.append(s,body);el('tasks').append(box)}}
for(const [value,label] of [['all','全部'],['failed','有缺口'],...Object.entries(names)]){const b=text('button',label,value==='all'?'on':'');b.onclick=()=>{el('filters').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderTasks(value)};el('filters').append(b)}renderTasks();
function issues(){el('issues').replaceChildren();for(const i of v.issues.filter(i=>el('severity').value==='all'||i.severity===el('severity').value)){const row=text('div','', 'issue'),body=text('div','');row.append(text('strong',i.severity==='blocker'?'阻断运行':'需审查',i.severity==='blocker'?'bad':'warn'));body.append(text('strong',i.message),text('p',`建议：${i.suggested_fix}`),text('small',`${i.task_id||'评测包'} · ${i.field} · ${i.code}`));row.append(body);el('issues').append(row)}}el('severity').onchange=issues;issues();
if(d.controls){el('calibration').append(text('h2','正负例校准'),text('p',d.calibration_passed?'参考实现全分，错误负例均被识别。仍需完成工程语义审查。':'校准未通过：需修复参考实现或判分标准，禁止发布。'),text('pre',JSON.stringify(d.controls,null,2)))}
if(d.rerun){el('reproduce').append(text('h2','复现本次运行'),text('p','在原仓库环境运行。评测包、agent 版本、代码或 seed 改变时需要新输出目录。'),text('pre',d.rerun));const b=text('button','复制复跑命令');b.onclick=async()=>{try{await navigator.clipboard.writeText(d.rerun);b.textContent='已复制'}catch{b.textContent='请选中上方命令复制'}};el('reproduce').append(b)}
</script></html>
