  validity_gate: true
  tests:
  - assert normalize_records([{'record_id':'001','part_id':'P-01','source_id':'S-09','length':.25,'unit':'m'}])
    == {'accepted':[{'record_id':'001','part_id':'P-01','source_id':'S-09','length_mm':250}],
    'rejected':[]}
  - assert normalize_records([{'record_id':'X','part_id':'P','source_id':'S','length':3,'unit':'mm'},
    {'record_id':'X','part_id':'P','source_id':'S','length':4,'unit':'mm'}]) == {'accepted':[],
    'rejected':[{'record_id':'X','reason':'duplicate_id'},{'record_id':'X','reason':'duplicate_id'}]}
  - assert normalize_records([{'record_id':'A','part_id':'P','source_id':'S','length':4,'unit':'inch'}])
    == {'accepted':[], 'rejected':[{'record_id':'A','reason':'unknown_unit'}]}
  - assert normalize_records([{'record_id':'A','part_id':'P','source_id':'S','length':True,'unit':'mm'},
    {'record_id':'B','part_id':'P','source_id':'S','length':float('nan'),'unit':'mm'}])
    == {'accepted':[], 'rejected':[{'record_id':'A','reason':'invalid_length'},{'record_id':'B','reason':'invalid_length'}]}
  - assert normalize_records([{'record_id':'A','part_id':'P','length':2,'unit':'m'},{}])
    == {'accepted':[], 'rejected':[{'record_id':'','reason':'missing_id'},{'record_id':'A','reason':'missing_lineage'}]}
  - 'rows=[{''record_id'':''02'',''part_id'':''Part'',''source_id'':''S2'',''length'':7,''unit'':''mm''},
    {''record_id'':''01'',''part_id'':''part'',''source_id'':''S1'',''length'':1,''unit'':''mm''}]

    before=[dict(r) for r in rows]

    assert normalize_records(rows) == {''accepted'':[{''record_id'':''01'',''part_id'':''part'',''source_id'':''S1'',''length_mm'':1},
    {''record_id'':''02'',''part_id'':''Part'',''source_id'':''S2'',''length_mm'':7}],
    ''rejected'':[]}

    assert rows == before'
  - assert normalize_records([]) == {'accepted':[], 'rejected':[]}
