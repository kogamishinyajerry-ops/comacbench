# DeepSeek Harness 民机设计 Benchmark Registry（v0.1 草案）
#
# 本文件是机器可读的接入清单单一事实源（SSOT）。
# status 流转: proposed -> staged(数据镜像+环境可复现) -> integrated(adapter 跑通+首份基线报告) -> active(进入常规评测)
#              任意状态可进入 paused-env(内网无启动评测环境)，条件满足后回到 proposed。
# tier: S(必须纳入) / A(强烈建议) / B(选择性) / C(外围)
# 依据: 2026-08-19 调研报告 + 2026-08-19 内网环境策略（见 env-matrix.md）。
#
# ===== 内网环境策略（2026-08-19 决策）=====
# 1. 内网工程仿真栈为商业工具: ANSYS 系、StarCCM+、CATIA、Amesim、FENSAP、MATLAB（均有许可）。
# 2. Python 开源包无内部镜像，由验收人手工批量导入内网（按 env-matrix.md 分阶段清单，一次导入覆盖一批）。
# 3. OpenFOAM 不引入: FoamBench 暂缓; 端到端 CFD 仿真任务改用 Fluent/StarCCM 无界面批处理。
# 4. env_class 判定规则: 评测所需环境在内网不可启动 => status: paused-env，不进入任何排期。
#    env_class 取值: qa | python_sandbox | data_only | commercial_cfd | commercial_fea | matlab | missing
# 所有 license 字段必须与 license-notes.md 保持一致。

registry_version: 0.2
created: 2026-08-19
env_policy: 见 env-matrix.md（OpenFOAM 放弃；Python 手工导入；商业求解器走批处理）
report_source: benchmarks/report/2026-08-19-benchmark-survey.md

defaults:
  record_gap: false          # registry 本身不触发知识底座缺口记录
  public_comparable: true    # 公共可比层
  hidden_dynamic: false      # 受控隐藏层（动态生成题），逐任务覆盖

