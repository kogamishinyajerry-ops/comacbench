    env: 判分 design_artifact sketch_2d 模式（实体级匹配+闭合环计数+平面规格；oracle/gold 与判分共用算子）
    assets_revision: cbsk@adapted-2026-08-25
    status: integrated
    integrated_note: 2026-08-25 窄路 A 落地——GUI 任务改编为本仓库脚本协议（模型写 cadquery 构造题面规定曲线，导出 sketch.step）：GT 一手源=题面几何规格（题面明示拟合点/顶点为 authoritative，answer.f3d 不可解析仅后续交叉核验）。15 题=改编 5（chain/polygon/spline×s01-03）+自建 10（chain×3/polygon×3/spline×3）。判分管线双向自检：gold 全链 15/15 PASS + stub 15/15 地板 + oracle 15/15 满分（mean 1.0000 含双跑确定性）；cadgen solid 路径回归无恙。工程记录：闭合环计数两阶段实现（端点聚类→图分量全 2 度判环）。详见 data/cadbench-seldon/sketch_lite/PROVENANCE.md

