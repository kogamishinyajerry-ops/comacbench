notes:
  - "No reference/ data files: the reference QoIs are inline scalars in case.yaml (strouhal=0.164, cd_mean=1.33, cl_rms=0.23), so there is nothing to sha256-anchor; the REAL anchoring gate has an empty file set."
  - "St cross-checked 2026-08-11: Williamson (1988) parallel-shedding relation St = -3.3265/Re + B + C*Re evaluates to ~0.1643 at Re=100 (widely reproduced, e.g. Norberg's aspect-ratio study quoting A=-3.3265, B=0.1816, C=1.6e-4); 2-D simulations cluster at 0.1644-0.166 (Mittal 2005: 0.1644; Posdziech & Grundmann 2007: 0.1644; Park et al. 1998: 0.165; Ding et al.: 0.164-0.166). Anchored on 0.164."
  - "Cd_mean cross-checked 2026-08-11: 2-D simulation consensus 1.32-1.36 (Park et al. 1998: 1.33; Mittal 2005: 1.322; Stalberg et al. 2006: 1.32; Posdziech & Grundmann 2007: 1.325; Kang: 1.33; Wu & Shu: 1.334; Calhoun: 1.330). Anchored on Park et al. 1.33."
  - "Cl_rms cross-checked 2026-08-11: 2-D simulation consensus 0.226-0.235 (Park et al. 1998: 0.235; Mittal 2005: 0.226; Stalberg et al. 2006: 0.233; Posdziech & Grundmann 2007: 0.228; Placzek et al. 2008: 0.226; Braza et al. 1986: 0.21). Anchored on the consensus midpoint 0.23. NOTE: 3-D experiments (Norberg 2003) measure LOWER rms lift (~0.1 and below at Re=100) due to spanwise decorrelation — this case benchmarks 2-D simulations, so the 2-D computational consensus is the correct reference, not the 3-D measurement."
  - "Verification route: values gathered from multiple independent published comparison tables quoting the primary sources (e.g. ASME Open Engineering 1.4057009 drag-reduction paper's grid-independence table; Valani FYP validation table; ETH Zuerich particle-methods thesis Table; arXiv 1409.6676 Table 3), not from a single secondary source. The original Williamson 1988 / Park et al. 1998 PDFs were not read page-by-page; hence transcription_verified stays false even though every QoI was confirmed by >=2 independent sources."
  - "Cl_rms reference band half-width (~4%) is much smaller than the 15% case.yaml tolerance; the slack is deliberate, reflecting the 6000-cell demo mesh and coarse timestep, as stated in case.yaml."
  - "Full-run verification 2026-08-11: runs/20260811T115926Z_cylinder_re100_openfoam_c45efbd2 (docker v2312, blockMesh+pimpleFoam, 300 s simulated = 30001 force samples, 489 s wall). Shedding amplitude measured saturating at t~150 s (cl_rms 0.181 for t>=60, 0.199 t>=100, 0.212 t>=150, flat t>=200/250) — the original 60 s transient discard under-predicted cl_rms by ~15% and was raised to 150 s on this evidence (case.yaml description + post/compute_qoi.py default updated same day). Final QoIs on the t>=150 window: strouhal=0.16199 (1.2% err), cd_mean=1.31736 (1.0% err), cl_rms=0.21199 (7.8% err) — all within the case tolerances, MetricsEngine overall pass."
