# Provenance declaration for dam_break (see src/cfdb/provenance/).
# honesty is NEVER declared here: it is derived mechanically by the audit.
citation: >-
  Martin, J. C., Moyce, W. J., "Part IV. An experimental study of the
  collapse of liquid columns on a rigid horizontal plane",
  Phil. Trans. R. Soc. Lond. A 244(882), pp. 312-324, 1952
  (surge-front curve, column base width a = 2.25 in, height 2a, "n^2 = 2")
source_url: https://doi.org/10.1098/rsta.1952.0006
retrieved: "2026-08-11"
transcription_verified: true
file_hashes:
  reference/martin_moyce_1952_front.csv: 0474f8c4bdd5f2dda7da8f264e17ba2e6a95f592a30b244c5d534ff03426b103
  reference/interpolate_qoi.py: 458033c1c51f51f230b6bfc8cdf45076cac3f71d4d535170d9b6a45d53c75283
notes:
  - >-
    Digitization source: OpenMPS project benchmark file
    Benchmark/DamBreak/martin_moyce_1952_225.csv (github.com/openmps/openmps,
    retrieved 2026-08-11), itself digitized from Martin & Moyce (1952).
    Axes: tau = t*sqrt(2*g/a), z_over_a = Z/a measured from the column back
    wall (Z/a = 1 at tau = 0). This is the a = 2.25 in series; a companion
    a = 1.125 in series exists in the same repo but was NOT used (no second
    independent digitization of it was found).
  - >-
    transcription_verified: true means every one of the 13 overlapping points
    was cross-checked on 2026-08-11 against the INDEPENDENT Lethe digitization
    (chaos-polymtl/lethe, examples/multiphysics/dam-break/dam-break-2d.py,
    retrieved 2026-08-11): max |dz_over_a| = 0.013 (at tau = 0.85), all other
    points agree within 0.01. Both transcriptions cite the same Martin & Moyce
    (1952) experiment. The 14th point (tau = 3.093, Z/a = 3.893) has no Lethe
    counterpart but continues the shared trend (slope ~1.6). A third
    digitization (ShipFlow.jl, from Hirt & Nichols 1981 Fig. 11 / Stansby et
    al. 1998 Table 1) deviates by up to 0.2 in Z/a at early tau and was
    rejected as inconsistent. The primary 1952 paper scan was not directly
    inspected; verification is against two independent published digitizations.
  - >-
    The 1952 paper itself notes the exact onset of motion could not be
    recorded (finite gate-release time); some studies shift simulation time by
    +0.175 in tau to compensate. This case applies NO such shift; the 15% QoI
    tolerance absorbs the early-time effect (documented in case.yaml).
  - >-
    Inline qoi_values (Z/a at tau = 1.0/1.5/2.0/2.5/2.8) are generated by
    reference/interpolate_qoi.py (linear interpolation of the frozen CSV,
    stdlib only); the script is kept in the repo and anchored above so the
    QoI numbers are reproducible, never hand-edited.
