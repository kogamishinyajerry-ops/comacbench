  - "All 17 stations of the Table I Re=400 column cross-checked point-by-point on 2026-08-11 against independent reproductions: the ivan-pi transcription gist (github.com/ivan-pi/3e9326d18a366ffe6a8e5bfda6353219), the CTTC-UPC course notes 'Part 5: Numerical solution of the Navier-Stokes Equations' (upcommons.upc.edu), the UPC bachelor thesis by Montilla Rodriguez (upcommons.upc.edu, Table 8.1), Roache's 'Verification and Validation' book (2009), Wei et al. DSC paper (users.math.msu.edu/users/wei/PAPER/p79.pdf), a Comput. Phys. Commun. micropolar paper (osaka-u.ac.jp), Marchi et al. 2009 (scielo.br), Zhang 1990 (ESAIM M2AN) and the EAFIT thesis (repository.eafit.edu.co). Every station value was confirmed by at least two independent sources."
  - "Inline qoi centerline_umax=0.551 is linearly interpolated from this CSV at y/H=0.95 (probe-line top): between stations 0.9531 (u=0.55892) and 0.8516 (u=0.29093) it evaluates to 0.5507. The interpolation spans a wide, curved region of the profile, so the anchor carries ~1% interpolation bias in addition to the mesh-resolution error; both are covered by the documented 10% tolerance."
  - "Unlike the Re=100 sibling case, this CSV keeps exactly the 17 stations published in Ghia Table I (no inserted interpolation points)."
