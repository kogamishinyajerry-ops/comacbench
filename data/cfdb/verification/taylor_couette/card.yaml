# Gallery card copy for taylor_couette (cfdb showcase gallery).
# Case-root metadata OUTSIDE the frozen reference/visible trees:
# editing it never drifts a ruler (same discipline as provenance.yaml).
# Prose is grounded in this case's real files; structural facts
# (domain, gates, honesty, frozen status) are recomputed at render.
title: Taylor-Couette Circular Couette (Laminar)
capability: 搭建并跑通同心圆筒层流 Taylor-Couette 验证（内筒 R_i=0.05 m 以 omega=1 rad/s 旋转、外筒 R_o=0.10 m 静止，Re=2.5
  远低于 Taylor 失稳临界；OpenFOAM icoFoam，ESI v2312，4 个 90° 分块全环 blockMesh，2880 cells），从径向采样剖面提取
  utheta_midgap（中隙半径 r=0.075 m 处切向速度）并逼近解析解 u_theta(r)=A·r+B/r。
expected: 交 utheta_midgap≈0.0194444 m/s（解析精确值，reference/generate.py 逐点生成、BC 断言到 1e-15，sha256 锚定；
  held_out/qoi.json 同值冻结）。本案例真实跑过完整验证：docker v2312 全时长 endTime=10 s，径向剖面最大逐点相对误差
  0.18%，QoI 实测 0.01941113（0.17%），2026-08-11 记录在 provenance notes。
criteria: category=verification（对解析解），无 agent-eval 契约，走 cfdb run → MetricsEngine：|computed−0.0194444|/0.0194444
  ≤ 0.02 才 qoi_pass；NaN/Inf→fail、缺失→incomplete。2% 容差是文档化的领域决定：demo 网格实测误差 0.17%，余量留给平台/求解器版本漂移，
  不是暗箱 fudge。outputs.curves 为空，预算 600s 只警告不翻判定。
what_makes_it_bite: 两个真实咬过的坑都钉在案文里：(1) 时间步——deltaT=0.01（按壁速估 max Co≈0.23，看似安全）在脉冲起动瞬态
  t≈0.6 s 处数值发散（FPE），deltaT=0.005 才稳定收敛到解析解；controlDict 注释与 provenance notes 如实记录，复现者改 dt 会踩到。
  (2) adapter 鸿沟——cfdb OpenFOAM adapter 对非 naca0012 案例一律套 lid-driven-cavity 模板渲染 0/U（movingWall/fixedWalls），
  与本案例 innerCylinder/outerCylinder patch 不匹配，`cfdb run` 会 FATAL 而非跑出错误物理；collect_outputs 也没有
  utheta_midgap 提取器。诚实残差：本案例的验证证据来自直接 docker OpenFOAM 执行（blockMesh+icoFoam+sampleDict），
  adapter 接入属共享代码改动，刻意不在本案例贡献范围内。
