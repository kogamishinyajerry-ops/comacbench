id: taylor_couette
name: Taylor-Couette Circular Couette (Laminar)
category: verification
description: "Laminar circular Couette flow between concentric cylinders (2D annular
  section, OpenFOAM icoFoam, ESI v2312). Inner cylinder R_i=0.05 m rotates at
  omega=1 rad/s (rotatingWallVelocity), outer cylinder R_o=0.10 m stationary,
  nu=1e-3 -> Re=omega*R_i*(R_o-R_i)/nu=2.5, deeply subcritical for Taylor
  vortices. Reference is the exact analytical profile u_theta(r)=A*r+B/r with
  A=-omega*R_i^2/(R_o^2-R_i^2), B=omega*R_i^2*R_o^2/(R_o^2-R_i^2), generated
  point-by-point by reference/generate.py (pure stdlib, BCs asserted to machine
  precision) — no hand-typed numbers. QoI utheta_midgap = u_theta at the mid-gap
  radius r=0.075 m; reference 0.0194444 m/s. Tolerance 2% is a documented domain
  decision: a full endTime=10 s run on the shipped 2880-cell demo mesh (docker
  opencfd/openfoam-default:2312, 2026-08-11) measured 0.17% QoI error and 0.18%
  max pointwise profile error, so 2% absorbs solver-version/platform variation
  while still biting on any genuinely wrong setup."
physics:
  flow: incompressible
  turbulence: none
  dimensionality: 2d
  steady: false
conditions:
  reynolds: 2.5
geometry:
  type: internal
  source: null
mesh:
  family: structured_hex
  levels: ["single"]
  target_y_plus: null
solvers:
  - name: openfoam
    command: "icoFoam"
    timeout_sec: null
    steps:
      - name: block_mesh
        command: "blockMesh -case {{ run_dir }}/case"
        timeout_sec: 60
        critical: true
      - name: solve
        command: "icoFoam -case {{ run_dir }}/case"
        timeout_sec: 540
        critical: true
      - name: sample_profile
        command: "postProcess -func sampleDict -latestTime -case {{ run_dir }}/case"
        timeout_sec: 60
        critical: false
    parameters:
      nu: 0.001
      end_time: 10.0
      delta_t: 0.005
      write_interval: 400
outputs:
  fields: ["U", "p"]
  curves: []
  qoi:
    - utheta_midgap
  qoi_script: post/compute_qoi.py
reference:
  type: analytical
  files:
    profile: reference/couette_profile.csv
  qoi_values:
    # Exact: u_theta(0.075) = A*0.075 + B/0.075 = 0.0194444... m/s.
    # Same value frozen in held_out/qoi.json (both emitted by generate.py).
    utheta_midgap: 0.019444444444444445
  # Held-out copy of the QoI for the agent-eval scoring path (same mechanism
  # as lid_driven_cavity: frozen anchoring + scoring-time redirection). Like
  # that pilot, the held-out value here is deliberately the SAME number as the
  # public qoi_values — both come from the closed-form formula, so an
  # "independent" recomputation would be the same formula again; the residual
  # anti-copy gap is acknowledged, not solved, here.
  held_out_files:
    qoi: held_out/qoi.json
metrics:
  qoi_relative_tolerance:
    # 2%: measured error on the shipped demo mesh is 0.17% (see description);
    # the margin covers platform/solver-version drift, not a hidden fudge.
    utheta_midgap: 0.02
budget:
  max_runtime_sec: 600
  max_cells: null
