id: flat_plate_blasius_of
name: Flat Plate Blasius (OpenFOAM Verification)
category: verification
description: "Laminar flat-plate boundary layer verification, pure OpenFOAM (simpleFoam,
  simulationType laminar, blockMesh with leading-edge refinement). Complements
  verification/flat_plate_su2 (SU2-mesh variant) with a self-contained OpenFOAM setup:
  U_inf=1 m/s, nu=1e-5 m^2/s so Re_x = 1e5*x[m]; measurement stations x=0.1..1.0 m span
  Re_x = 1e4..1e5, safely laminar (transition ~5e5). Reference: Blasius correlation
  Cf(x)=0.664/sqrt(Re_x), generated pointwise by generate_reference.py (no hand-typed
  numbers). QoIs are local Cf at x=0.2/0.5/0.8/1.0 m. Tolerance 15% reflects the demo
  mesh (10500 cells, ~20 cells in the BL at x=0.1) and the leading-edge/finite-domain
  discretization error on wall shear — a documented domain decision, not a hidden fudge."
physics:
  flow: incompressible
  turbulence: none
  dimensionality: 2d
  steady: true
conditions:
  reynolds: 100000.0
geometry:
  type: external
  source: null
mesh:
  family: structured_hex
  levels: ["single"]
  target_y_plus: null
solvers:
  - name: openfoam
    command: "simpleFoam"
    timeout_sec: null
    steps:
      # v2312 blockMesh reads system/blockMeshDict; the case ships the dict at
      # the historical constant/polyMesh location (same layout as
      # validation/lid_driven_cavity), so the step stages it first.
      - name: block_mesh
        command: "bash -c 'cp {{ run_dir }}/case/constant/polyMesh/blockMeshDict {{ run_dir }}/case/system/blockMeshDict && blockMesh -case {{ run_dir }}/case'"
        timeout_sec: 120
        critical: true
      - name: solve
        command: "simpleFoam -case {{ run_dir }}/case"
        timeout_sec: 840
        critical: true
    parameters:
      nu: 1e-5
      u_inf: 1.0
      end_time: 2000
outputs:
  fields: ["U", "p", "wallShearStress"]
  curves: []
  qoi:
    - cf_x020
    - cf_x050
    - cf_x080
    - cf_x100
  qoi_script: post/compute_qoi.py
reference:
  type: analytical
  files:
    blasius: reference/blasius_cf.csv
  qoi_values:
    # Local Blasius Cf = 0.664/sqrt(Re_x) at the four QoI stations, computed by
    # generate_reference.py (same values as held_out/qoi.json — see note below).
    cf_x020: 0.00469519
    cf_x050: 0.0029695
    cf_x080: 0.00234759
    cf_x100: 0.00209975
  # Held-out pilot (same mechanism as validation/lid_driven_cavity): wires the
  # agent-eval scoring path to a copy of the reference kept out of the public
  # reference/ tree. The held-out values are deliberately the SAME as the public
  # qoi_values (both regenerated by generate_reference.py) — this proves the
  # frozen-anchoring mechanism; it does NOT yet add anti-copy value from an
  # independently recomputed number.
  held_out_files:
    qoi: held_out/qoi.json
metrics:
  qoi_relative_tolerance:
    # 15% per station: the demo mesh (10500 cells) resolves the BL with ~20
    # cells at x=0.1 but wall-shear accuracy near Re_x=1e4..1e5 on this mesh is
    # grid-limited; documented domain decision (same discipline as the 10%
    # tolerance on validation/lid_driven_cavity's coarse 32x32 mesh).
    cf_x020: 0.15
    cf_x050: 0.15
    cf_x080: 0.15
    cf_x100: 0.15
budget:
  max_runtime_sec: 900
  max_cells: null
