id: pipe_poiseuille
name: Pipe Hagen-Poiseuille (Re_D=20)
category: verification
description: "Hagen-Poiseuille fully developed laminar pipe flow, OpenFOAM icoFoam, axisymmetric 5-degree wedge mesh (collapsed axis edge, wedge patch type; R=0.005 m, L=0.12 m, U_mean=0.1 m/s, nu=5e-5 m^2/s, Re_D=20). Reference: closed-form analytical solution u(r)=2*U_mean*(1-(r/R)^2), machine-generated by reference/generate.py (anchored in provenance). QoIs: u_max = max Ux over the volume (reference 0.2 m/s) and wall_u_avg = areaAverage of U on the wall patch faces (reference (0 0 0) — a surfaceFieldValue on the patch, deliberately NOT an interior line sample, which on a coarse mesh extrapolates a spurious slip velocity at the wall). Tolerance 10% (u_max) / 2e-3 m/s absolute (wall_u_avg) reflects the coarse 120x20 demo wedge mesh (documented domain decision, not a hidden fudge)."
physics:
  flow: incompressible
  turbulence: none
  dimensionality: axisymmetric
  steady: false   # icoFoam is transient; run to t=1.0 s ~ 2x R^2/nu diffusion times
conditions:
  reynolds: 20.0   # Re_D = U_mean * D / nu = 0.1 * 0.01 / 5e-5
geometry:
  type: internal
  source: null
mesh:
  family: structured_hex
  levels: ["single"]
  target_y_plus: null   # laminar, no wall functions; uniform 20-cell radial spacing
solvers:
  - name: openfoam
    command: "icoFoam"
    timeout_sec: null
    steps:
      - name: block_mesh
        command: "blockMesh -case {{ run_dir }}/case"
        timeout_sec: 60
        critical: true
      - name: solve
        command: "icoFoam -case {{ run_dir }}/case"
        timeout_sec: 540
        critical: true
    parameters:
      nu: 5e-5
      u_mean: 0.1
      radius: 0.005
      length: 0.12
      end_time: 1.0
      delta_t: 5e-4
      write_interval: 2000
outputs:
  fields: ["U", "p"]
  curves: []
  qoi:
    - u_max
    - wall_u_avg
  qoi_script: post/compute_qoi.py
reference:
  type: analytical
  files:
    radial_profile: reference/radial_profile.csv
  qoi_values:
    u_max: 0.2
    wall_u_avg: 0.0
  # held-out copy for the agent-eval scoring path (same mechanism as the
  # lid_driven_cavity Wave D2 pilot): deliberately the SAME values as the
  # public qoi_values above — both come straight from the closed-form
  # solution, so this proves the frozen-anchoring mechanism but adds no
  # anti-copy value from an independently recomputed number (explicitly not
  # solved here; see Architecture v5.0 §5.2/§8).
  held_out_files:
    qoi: held_out/qoi.json
metrics:
  qoi_relative_tolerance:
    u_max: 0.10
  # zero-reference QoI: relative error undefined, gate on absolute error.
  # 2e-3 m/s = 2% of U_mean; a true noSlip patch-face average is 0 by
  # construction, so any larger value means a broken wall BC or a
  # slip-extrapolating sampling method.
  qoi_absolute_tolerance:
    wall_u_avg: 0.002
budget:
  max_runtime_sec: 600
  max_cells: null
