notes:
  - "Task physics and the held-out QoI anchor are inherited from the
    VALIDATED case cases/validation/backward_facing_step_laminar (Erturk
    2008 x1/h table, Re=100 row 2.922, cross-checked against the original
    table and >=2 independent reproductions per the source case's
    provenance; Re = Um*D_h/nu with D_h = 2*inlet channel height, the
    Armaly/Erturk convention). held_out/qoi.json is a verbatim copy of the
    source case's held_out/qoi.json — no new reference number was created."
  - "This case re-expresses that validation setup as a case_setup
    EVIDENCE-mode task: the agent sees only the solver-neutral brief +
    drawing, drives any solver off-judge, and submits an evidence bundle
    (layout v1: manifest.json, evidence/solver.log, evidence/mesh_report.txt,
    evidence/samples/wall_shear.csv). The judge runs no solver; the frozen
    reference/compute_qoi.py (stdlib-only, host-side) validates the sample
    layout (header exactly x,tau_w; x >= 0 strictly increasing, coverage to
    >= 5h; >= 10 stations) and reduces reattachment_x_over_h from the
    first negative->positive tau_w zero crossing (linear interpolation) —
    the standard near-wall reattachment proxy of the BFS literature and
    the SAME definition as the source case's QoI extraction (Ux sign
    change at the first bottom-cell-centre height: sign(tau_w) =
    sign(Ux_near), so the crossing location is identical)."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
    (host-side matplotlib authoring tool, NOT part of the scoring path);
    every annotated dimension (h=0.01 m, ER 1:2, inlet at -5h, outlet at
    30h, Um=1.0 m/s, nu=2.0e-4) matches the brief. The vertical axis is
    exaggerated for readability (noted on the drawing). The generator is
    kept in-tree under reference/ so the frozen visible asset is
    re-derivable; it is anchored above and by the contract manifest.
    System python3 matplotlib was used (the cfdb uv env ships no
    matplotlib); the generator is not part of any judged path."
  - "budget.max_runtime_sec=3600 is a deliberately generous envelope: in
    evidence mode the within_budget gate consumes the SELF-REPORTED
    manifest timing.wall_time_sec (weakened semantics — the judge never
    clocks the solver run; when undeclared the gate degrades to the
    judge-side reduction clock and the notes say so loudly). The golden
    docker run measured 8.3 s wall."
  - "Golden E2E (2026-08-11, ruler #d05e8142): the golden evidence bundle
    was CONVERTED from the source case's real docker run
    runs/20260811T081250Z_backward_facing_step_laminar_openfoam_1479c65b
    (simpleFoam laminar, 6100 cells, opencfd/openfoam-default:2312 @
    sha256:097e45046a74, SIMPLE converged in 459 iterations, wall 8.26 s)
    by the witness converter
    agentbench/backward_step_from_brief/make_golden_evidence.py
    (solver.log <- log.solve verbatim, mesh_report.txt <- log.block_mesh
    verbatim, wall_shear.csv <- near-bottom Ux sample converted as
    tau_w = mu*Ux/y_probe with y_probe=1e-4 m, mu=2e-4 Pa s — the run
    wrote no native wall-shear field; the estimate's zero crossing IS the
    Ux sign change, so the golden reduction reproduces the source case's
    measured value exactly). Scored valid=true, score=-0.017273 (computed
    2.8715283156260316 vs held-out 2.922, 1.73% — bit-identical to the
    source case's docker-verified measurement recorded in the run's
    qoi.json). Witness bundle, ledger and run artifacts are kept under
    agentbench/backward_step_from_brief/ (submissions/, runs/,
    ledger.jsonl), outside the frozen case trees."
  - "Negative control E2E (2026-08-11, same ruler): wall_shear.csv with
    all x stations translated +1h (zero crossing shifted one step height
    downstream) scored valid=true, score=-0.324958 (computed 3.8715,
    error 32.5% vs golden 1.73%) — the continuous score discriminates a
    shifted reattachment point as designed."
  - "Trust posture (inherited from the evidence-mode scorer): this verdict
    validates the bundle and recomputes the QoI from raw evidence; it does
    NOT prove a solver actually ran. The held-out value is a published
