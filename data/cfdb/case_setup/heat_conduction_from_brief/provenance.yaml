notes:
  - "Task physics is inherited verbatim from the VERIFIED case
    cases/verification/heat_conduction_1d (L=1 m, T_s=300 K both faces,
    alpha=0.1 m^2/s, S=100 K/s specific; analytic T(x)=300+500*x*(1-x) K,
    midplane 425.0 K). That case's 2026-08-11 full docker run on
    opencfd/openfoam-default:2312 measured midplane_T=424.9998849 K
    (2.708e-7 relative, limited by the transient tail after endTime=40 s
    = 4 diffusion time scales). This task re-expresses that verified
    setup as a case_setup EVIDENCE-mode task: the agent sees only the
    brief + drawing, drives its own solver, and submits an evidence
    bundle (layout v1 documented in visible/task.md)."
  - "reference/compute_qoi.py reduces midplane_T from the SUBMITTED
    profile (evidence/samples/profile.csv, header x,temperature) by
    linear interpolation at x=L/2 — the same reduction as the source
    case's post/compute_qoi.py (mean of the two bracketing cells), made
    mesh-agnostic. stdlib-only per the qoi_script contract; runs on the
    HOST at scoring time on the submission directory."
  - "Header naming pitfall found empirically (2026-08-11, first golden
    attempt, ruler 9c64cbd5): the judge's generic CSV check
    (casesetup_evidence_scorer protocol step 3) treats any header
    matching time/t/iter/iteration/step/timestep CASE-INSENSITIVELY as a
    time axis that must be monotonically non-decreasing — a temperature
    column named 'T' collides with 't' and the physical profile
    (decreasing after the midplane) was rejected fail-closed. The
    contract therefore names the column 'temperature' and visible/task.md
    documents this explicitly. Reported to the platform as a scorer
    footgun for CFD evidence (single-letter case-insensitive match);
    NOT patched in src/ per the no-src-edit rule of this batch."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
    (host-side matplotlib authoring tool, NOT part of the scoring path);
    every annotated number (L=1 m, T_s=300 K, alpha=0.1, S=100, q/k=1000)
    matches the brief and the golden source configuration. English-only
    annotations avoid CJK glyph issues. The generator is kept in-tree
    under reference/ so the frozen visible asset is re-derivable."
  - "held_out/qoi.json holds the analytical T(L/2)=425.0 K, the ONLY
    scoring reference (case.yaml declares no public qoi_values). The
    value is textbook-derivable, so anti-copy does NOT rest on secrecy of
    the number: every scored number is recomputed from the raw submitted
    profile by the frozen script — a self-reported final QoI never enters
    the verdict. Run authenticity is NOT proven by the judge (evidence
    mode by design); it is anchored by the production harness driving the
    agent live."
  - "budget.max_runtime_sec=3600 is deliberately loose: in evidence mode
    the judge never runs the solver, so the budget gates (a) the host-side
    QoI reduction timeout and (b) the within_budget gate on the
    SELF-REPORTED manifest timing.wall_time_sec — degraded gate semantics
    versus managed mode (it gates a self-reported number, not a
    backend-measured one; when absent, only the reduction clock is gated
    and the scorer notes the degradation loudly). The golden OpenFOAM run
    solves this 1D problem in < 1 s, so 3600 s is headroom for arbitrary
    external solvers, not a discrimination knob."
  - "E2E evidence (2026-08-11, ruler #39f75cff): the golden bundle was
    converted from the verified source run
    runs/20260811T080515Z_heat_conduction_1d_openfoam_43876d3a by
    agentbench/heat_conduction_from_brief/make_golden_evidence.py
    (witness, outside the frozen trees) — final-time T field at the 100
    cell centres plus verbatim solver/blockMesh logs. It scored
    valid=true, score=-2.70824e-07 (computed 424.9998849 vs held-out
    425.0, matching the source case's pinned measurement exactly).
    Negative controls: perturbing every profile value by 15% scored
    valid=true with score=-0.15 (continuous score tracks the perturbation
    exactly); deleting evidence/samples/profile.csv scored valid=false
    (fail-closed on a missing required file). Witness submissions, the
    converter and run artifacts are kept under
    agentbench/heat_conduction_from_brief/ (submissions/, runs/,
    ledger.jsonl)."
