citation: >-
  Incropera, F. P., DeWitt, D. P., Bergman, T. L., Lavine, A. S.,
  "Fundamentals of Heat and Mass Transfer", 7th ed., Wiley, 2011
  (steady 1D conduction in a plane wall with uniform heat generation,
  both surfaces at T_s: T(x) = T_s + (q/2k) * x * (L - x), so
  T(L/2) = T_s + (q/k)*L^2/8 = 300 + 1000/8 = 425.0 K) — inherited from
  the VERIFIED case cases/verification/heat_conduction_1d, whose task
  physics and docker-verified measurement this evidence-mode task reuses.
