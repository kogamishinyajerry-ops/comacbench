title: 从工程任务书搭建固体内热源一维导热算例（evidence 模式）
capability: case_setup 域 evidence 模式任务：agent 只拿到自然语言工程任务书（visible/task.md）和带尺寸标注的平板示意图
  （visible/drawing.png），用自己环境中的任意求解器（Fluent/STAR-CCM+/自研/OpenFOAM 均可，judge 不预装任何求解器）求解固体平板
  一维导热——L=1 m、两侧固温 300 K、均布体积热源（dT/dt=α·d²T/dx²+S，α=0.1 m²/s、S=100 K/s，即 q/k=1000 K/m²），积分到稳态后按
  证据包合同提交 manifest.json、求解器原生日志、网格报告和稳态温度剖面 CSV。judge 不跑求解器，只校验证据包并用冻结 QoI 脚本
  （reference/compute_qoi.py，stdlib-only，宿主机执行，末行 stdout 为 JSON）从原始剖面线性插值出中面温度 midplane_T。
expected: 交一个证据包（submission/manifest.json + evidence/solver.log + evidence/mesh_report.txt + evidence/samples/profile.csv，
  表头 x,temperature 逐列文档化在任务书里）。held_out 参考 425.0 K（解析值 T(L/2)=T_s+(q/k)L²/8，Incropera & DeWitt），案面无公开
  qoi_values——唯一评分参考即留出副本，且每个被评分的数字都由冻结脚本从原始证据重算，自报终值不进入评分。黄金 E2E 已实证
  （2026-08-11，ruler 39f75cff）：由素材案例真实 docker 运行产物转换的黄金证据包归约出 midplane_T=424.9998849 K（相对误差
  2.708e-7，与素材案例钉值完全一致），valid=true，score=-2.70824e-07。
criteria: 冻结两门 AND：① qoi_complete——证据包必需文件齐全非空、manifest 含非空 solver 字段、CSV 通过通用一致性校验、QoI 脚本
  成功归约出声明的 key（任一步失败即 fail-closed invalid）；② within_budget——自报 timing.wall_time_sec ≤ 3600s（evidence 模式
  judge 不跑求解器，预算门基于 manifest 自报墙钟，语义较 managed 模式减弱——门的是自报数而非后端实测，缺省时降级为只门宿主机
  归约耗时，scorer 会大声记录该降级）。两门过才给连续分 score=−qoi_error，1% 容差仅作文档（沿用素材案例的领域决定）。
what_makes_it_bite: 三个显式考点：(1) 证据包合同的纪律——必需文件缺失/为空、manifest 缺 solver、CSV 含 NaN/Inf 都 fail-closed；
  温度列命名是实测踩中的坑——judge 通用 CSV 校验把大小写不敏感的 t 表头当时间轴要求单调非降，温度列若命名 T 会在剖面后半段
  递减处被误判（2026-08-11 黄金首轮即踩中，已改表头为 temperature 并在任务书明示）；(2) 物理陷阱沿素材案例继承——源项必须以
  单位体积注入（specific），按总量摊到 1e-4 m³ 计算域会把源放大 1e4 倍、中面温度飙到 ~1.25e6 K；瞬态求解需 endTime 覆盖约 4 个
  扩散时间尺度 L²/α=40 s 才能压掉拖尾；(3) 负控实证（2026-08-11，ruler 39f75cff）：剖面数值整体扰动 15% 评分降至 score=-0.15
  （连续分严格反映扰动幅度）；删掉 evidence/samples/profile.csv 则 fail-closed 判 invalid、score=None。残差：held_out 值是教科书
  可推的解析值，运行真实性不由 judge 证明（evidence 模式设计即如此——真实性由生产 harness 锚定，证据包合同使伪造需编造全套
  求解器原生产物，且所有被评分数字仍由冻结脚本从原始证据重算）。
