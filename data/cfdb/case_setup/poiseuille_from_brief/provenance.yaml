  reference/make_drawing.py: c40512ff2c821704bfa5a0a7370caf6bcea3410c61ee8e05f6b4560a6c2a48e5
notes:
  - "Task physics and golden configuration are inherited from the VERIFIED
    case cases/verification/channel_poiseuille (u_max=0.15 analytical;
    2026-08-11 full docker run on opencfd/openfoam-default:2312 measured
    centerline_umax=0.149254 m/s, 0.50% low, inside the 5% V&V tolerance).
    This pilot re-expresses that verified setup as a case_setup task: the
    agent sees only the brief + drawing and must rebuild the case."
  - "reference/compute_qoi.py is adapted verbatim (docstring aside) from
    channel_poiseuille/post/compute_qoi.py — the same probe-parsing logic
    that produced the verified measurement. stdlib-only per the qoi_script
    contract; runs on the HOST at scoring time (the judge image ships no
    python3), reading only the solver output the sandbox left behind."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
    (host-side matplotlib authoring tool, NOT part of the scoring path);
    every annotated dimension (H=0.01 m, L=0.12 m, U0=0.1 m/s, probe at
    x/H=10) matches the golden blockMeshDict/boundary configuration. The
    generator is kept in-tree under reference/ so the frozen visible asset
    is re-derivable; it is anchored above and by the contract manifest."
  - "held_out/qoi.json holds the analytical u_max = 1.5*U0 = 0.15 m/s, the
    ONLY scoring reference (case.yaml declares no public qoi_values). The
    value is textbook-derivable, so anti-copy does NOT rest on secrecy of
    the number: it rests on the case_setup mechanism itself — the scored
    QoI comes out of a real sandboxed solver run of the submitted case,
    never out of a file the submission writes. This is strictly stronger
    than the v5.0 Wave D2 pilots (lid_driven_cavity, channel_poiseuille),
    where the held-out value deliberately equals the public one and a
    hand-written qoi.json still scores."
  - "budget.max_runtime_sec=360 is 3x the golden run's ~2 min docker wall
    (blockMesh + icoFoam to t=5 s, 4800 cells), per the pilot brief. On the
    authoring machine the 2026-08-11 golden E2E actually measured 16.7 s
    total (solve 15.4 s), so the budget is conservative there; it is kept
    at 360 s because the earlier verified measurement on this image was
    ~2 min (slower host), and 360 s is 3x THAT number."
  - "E2E evidence (2026-08-11, ruler #19804d0d, real docker sandbox
    opencfd/openfoam-default:2312 @ sha256:097e45046a74): golden submission
    (= channel_poiseuille golden config with blockMeshDict staged to
    system/) scored valid=true, score=-0.00497 (computed 0.149254 vs
    held-out 0.15, 0.50% — matching the source case's verified
    measurement); a negative control deleting the inlet patchField from
    0/U scored valid=false (icoFoam exit 1, fail-closed). A second
    negative control with nu=5e-4 (Re off by 10x) scored IDENTICALLY to
    golden — fully developed plane Poiseuille u_max=1.5*U_mean is
    nu-independent and endTime=5 s >> H^2/nu=0.2 s even at the wrong
    viscosity, so that perturbation does not discriminate this QoI;
    recorded here so future negative controls for this case pick a
    discriminating knob (e.g. geometry, inlet velocity, probe position,
    or structural breakage). Witness submissions and run artifacts are
    kept under agentbench/poiseuille_from_brief/ (submissions/, runs/,
    ledger.jsonl), outside the frozen case trees."
