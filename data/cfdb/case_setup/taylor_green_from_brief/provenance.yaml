notes:
  - "Task physics is inherited verbatim from the VERIFIED case
    cases/verification/taylor_green_vortex (doubly periodic [0,2*pi]^2,
    U0=1, k=1, nu=0.01, Re=100, t in [0,5] s; sample line at
    y = 11*pi/64 = 0.5399612... m, the source case's controlDict
    sampleLine ordinate = mesh row j=5 centre on the 64x64 demo mesh).
    That case's 2026-08-11 full docker run on opencfd/openfoam-default:2312
    measured ke_ratio_end=0.8119854701224898 (0.82% low) and
    u_line_l2_rel_end=0.004340225467502078. This task re-expresses that
    verified setup as a case_setup EVIDENCE-mode task: the agent sees
    only the brief + drawing, drives its own solver, and submits an
    evidence bundle (layout v1 documented in visible/task.md)."
  - "reference/compute_qoi.py adapts the source case's
    post/compute_qoi.py reduction to the evidence bundle:
    ke_ratio_end = ke(t=5)/ke(t=0) with BOTH endpoints read from the
    submitted ke_history.csv (self-normalising; the source case divided
    by the analytic KE0=0.25, which equals the grid-exact discrete mean
    of the t=0 field, so the two reductions coincide), and
    u_line_l2_rel_end against the same frozen analytic field evaluated
    at the submitted sample abscissae (Y_LINE frozen in-script, exactly
    as in the source script). stdlib-only; runs on the HOST on the
    submission directory."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
    (host-side matplotlib authoring tool, NOT part of the scoring path);
    every annotated number (2*pi domain, U0=1, k=1, nu=0.01, Re=100,
    y=11*pi/64) matches the brief and the golden source configuration.
    English-only annotations avoid CJK glyph issues. The generator is
    kept in-tree under reference/ so the frozen visible asset is
    re-derivable."
  - "held_out/qoi.json holds the analytical exp(-0.2)=0.8187307530779818
    and 0.0 (zero-reference L2), the ONLY scoring reference (case.yaml
    declares no public qoi_values). The values are textbook-derivable, so
    anti-copy does NOT rest on secrecy of the numbers: every scored
    number is recomputed from the raw submitted evidence by the frozen
    script — a self-reported final QoI never enters the verdict. Run
    authenticity is NOT proven by the judge (evidence mode by design); it
    is anchored by the production harness driving the agent live."
  - "budget.max_runtime_sec=3600 is deliberately loose: in evidence mode
    the judge never runs the solver, so the budget gates (a) the
    host-side QoI reduction timeout and (b) the within_budget gate on the
    SELF-REPORTED manifest timing.wall_time_sec — degraded gate semantics
    versus managed mode (it gates a self-reported number, not a
    backend-measured one; when absent, only the reduction clock is gated
    and the scorer notes the degradation loudly)."
  - "E2E evidence (2026-08-11, ruler #05599b0a): the golden bundle was
    converted from the verified source run
    runs/20260811T080645Z_taylor_green_vortex_openfoam_88374f4f by
