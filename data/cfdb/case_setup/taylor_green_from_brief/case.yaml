id: taylor_green_from_brief
name: "Case Setup: Taylor-Green Decaying Vortex from Engineering Brief (evidence mode)"
category: case_setup
domain: case_setup
description: >-
  case_setup domain EVIDENCE-mode task: the agent receives only a
  natural-language engineering brief (visible/task.md) and an annotated
  dimensioned drawing (visible/drawing.png), drives an ARBITRARY solver in
  its own environment (the judge has NO solver), and submits an evidence
  bundle (manifest.json + raw solver log + mesh report + kinetic-energy
  history CSV + final-time sample-line CSV). The judge validates the
  bundle and the frozen QoI script reference/compute_qoi.py reduces
  ke_ratio_end (KE(t=5)/KE(t=0), KE = domain mean of 0.5*|u|^2) and
  u_line_l2_rel_end (relative L2 error of (u, v) along the t=5 sample
  line at y = 11*pi/64 vs the frozen analytic field) on the host. Task
  physics: 2D Taylor-Green decaying vortex, doubly periodic [0, 2*pi]^2,
  U0 = 1 m/s, k = 1 1/m, nu = 0.01 m^2/s (Re = 100), incompressible
  laminar, t in [0, 5] s. Held-out reference QoI = analytical
  exp(-0.2) = 0.8187307530779818 and 0.0 (Taylor & Green 1937). Golden
  measurement inherited from the VERIFIED case
  cases/verification/taylor_green_vortex (2026-08-11 docker run measured
  ke_ratio_end = 0.8119854701224898, u_line_l2_rel_end =
  0.004340225467502078); see provenance.yaml.
physics:
  flow: incompressible
  turbulence: none
  dimensionality: 2d
  steady: false
conditions:
  reynolds: 100.0
geometry:
  type: periodic
  source: null
mesh:
  family: structured_hex
  levels: ["single"]
  target_y_plus: null
solvers:
  # Placeholder only: evidence mode runs NO solver on the judge — the
  # scored numbers are reduced from the submitted evidence bundle by the
  # frozen QoI script on the host.
  - name: generic
    command: "true"
execution:
  setup_mode: evidence
  evidence:
    required_files:
      - manifest.json
      - evidence/solver.log
      - evidence/mesh_report.txt
      - evidence/samples/ke_history.csv
      - evidence/samples/line_end.csv
    notes: >-
      Evidence bundle layout v1; per-file per-column formats are
      documented in visible/task.md (the agent-readable surface).
outputs:
  fields: ["U", "p"]
  curves: []
  qoi:
    - ke_ratio_end
    - u_line_l2_rel_end
  qoi_script: reference/compute_qoi.py
reference:
  type: analytical
  # No public qoi_values: the ONLY scoring reference is the held-out copy.
  # The analytical values (exp(-4*nu*k^2*t) decay; zero-reference L2) are
  # textbook knowledge the brief does not state; the scored numbers are
  # always recomputed from the submitted raw evidence by the frozen
  # script, never self-reported.
  held_out_files:
    qoi: held_out/qoi.json
metrics:
  # Documentary only (agent-eval gates are qoi_complete + within_budget;
  # QoI accuracy is an ungated continuous score = -qoi_error). 5% mirrors
  # the verified taylor_green_vortex tolerances for the same physics
  # (coarse demo mesh decision); u_line_l2_rel_end is a zero-reference
  # QoI documented with an absolute tolerance in the source case.
  qoi_relative_tolerance:
    ke_ratio_end: 0.05
  qoi_absolute_tolerance:
    u_line_l2_rel_end: 0.05
budget:
  # Evidence mode: the judge never runs the solver, so this budget gates
  # (a) the host-side QoI reduction timeout and (b) the within_budget gate
  # on the SELF-REPORTED manifest timing.wall_time_sec — degraded gate
  # semantics by design (see card.yaml). 3600 s is a deliberately loose
  # ceiling for an arbitrary external solver on this problem (the golden
  # OpenFOAM run solves in seconds).
  max_runtime_sec: 3600
  max_cells: null
