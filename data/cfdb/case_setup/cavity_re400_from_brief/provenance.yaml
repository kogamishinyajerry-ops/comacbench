notes:
  - "Task physics and the held-out QoI anchor are inherited from the
    VALIDATED case cases/validation/lid_driven_cavity_re400 (Ghia et al.
    1982 Table I Re=400, 17 stations cross-checked against >=2 independent
    reproductions per the source case's provenance; centerline_umax=0.551
    is the linear interpolation at y/H=0.95 between stations 0.9531 and
    0.8516). held_out/qoi.json is a verbatim copy of the source case's
    held_out/qoi.json — no new reference number was created."
  - "This case re-expresses that validation setup as a case_setup
    EVIDENCE-mode task: the agent sees only the solver-neutral brief +
    drawing, drives any solver off-judge, and submits an evidence bundle
    (layout v1: manifest.json, evidence/solver.log, evidence/mesh_report.txt,
    evidence/samples/centerline.csv). The judge runs no solver; the frozen
    reference/compute_qoi.py (stdlib-only, host-side) validates the sample
    layout (header exactly y,u,v; y strictly increasing within
    [0, 0.095] m, top station >= 0.09 m; >= 10 stations) and reduces
    centerline_umax = max sqrt(u^2+v^2)/U_lid — the SAME definition as the
    source case's QoI (max |U|/U_lid on the centerline up to y/H=0.95)."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
    (host-side matplotlib authoring tool, NOT part of the scoring path);
    every annotated dimension (H=0.1 m, U_lid=1.0 m/s, nu=2.5e-4, sample
    line x=H/2 up to y/H=0.95) matches the brief. The generator is kept
    in-tree under reference/ so the frozen visible asset is re-derivable;
    it is anchored above and by the contract manifest. System python3
    matplotlib was used (the cfdb uv env ships no matplotlib); the
    generator is not part of any judged path."
  - "budget.max_runtime_sec=3600 is a deliberately generous envelope: in
    evidence mode the within_budget gate consumes the SELF-REPORTED
    manifest timing.wall_time_sec (weakened semantics — the judge never
    clocks the solver run; when undeclared the gate degrades to the
    judge-side reduction clock and the notes say so loudly). The golden
    docker run measured 27.5 s wall."
  - "Golden E2E (2026-08-11, ruler #e76a5b33): the golden evidence bundle
    was CONVERTED from the source case's real docker run
    runs/20260811T081250Z_lid_driven_cavity_re400_openfoam_db150f3f
    (icoFoam, 4096 cells, opencfd/openfoam-default:2312 @
