id: pipe_from_brief
name: "Case Setup: Pipe Hagen-Poiseuille from Engineering Brief (evidence mode)"
category: case_setup
domain: case_setup
description: >-
  case_setup domain EVIDENCE-mode task: the agent receives only a
  natural-language engineering brief (visible/task.md) and an annotated
  dimensioned drawing (visible/drawing.png), then drives ANY CFD solver in
  its own environment (Fluent, STAR-CCM+, in-house code, OpenFOAM, ... —
  the judge runs NO solver at all) and submits an evidence bundle
  (manifest.json + solver-native log + mesh report + sampled radial
  profile). The judge validates the bundle (required files, manifest
  shape, generic CSV consistency) and recomputes the QoIs from the raw
  evidence with the frozen script reference/compute_qoi.py on the host; a
  self-reported final QoI never enters the verdict. Task physics: fully
  developed laminar pipe flow (Hagen-Poiseuille), R=0.005 m, L=0.12 m,
  plug inlet U_mean=0.1 m/s, nu=5e-5 m^2/s (Re_D=20), transient laminar to
  developed state. QoIs from the radial profile at x=0.1 m: u_max (max
  axial velocity; held-out reference 0.2 = 2*U_mean) and wall_u_avg (wall
  endpoint value of the profile; held-out reference 0.0, exact for a
  no-slip wall — the contract anchors the wall endpoint to the wall
  BOUNDARY value because interior line sampling on a coarse mesh
  extrapolates a spurious slip velocity, the pit documented by the source
  case). Golden evidence is reduced from the verified docker run of
  cases/verification/pipe_poiseuille (measured u_max=0.199338, 0.33% low);
  see provenance.yaml.
physics:
  flow: incompressible
  turbulence: none
  dimensionality: axisymmetric
  steady: false
conditions:
  reynolds: 20.0
geometry:
  type: internal
  source: null
mesh:
  family: structured_hex
  levels: ["single"]
  target_y_plus: null
solvers:
  # Placeholder only: evidence mode runs NO solver on the judge — the
  # submission is an evidence bundle produced by the agent's own solver
  # environment; only the frozen QoI script executes (on the host).
  - name: generic
    command: "true"
execution:
  setup_mode: evidence
  evidence:
    required_files:
      - manifest.json
      - evidence/solver.log
      - evidence/mesh_report.txt
      - evidence/samples/profile.csv
    notes: >-
      Evidence bundle layout v1 (uniform across case_setup evidence tasks);
      per-file and per-column contract is documented in visible/task.md.
outputs:
  fields: ["U", "p"]
  curves: []
  qoi:
    - u_max
    - wall_u_avg
  qoi_script: reference/compute_qoi.py
reference:
  type: analytical
  # No public qoi_values: the ONLY scoring reference is the held-out copy
  # (u_max = 2*U_mean = 0.2 m/s, wall_u_avg = 0.0 — the same values the
  # verified source case anchors). The numbers are textbook-derivable;
  # anti-copy rests on the evidence-reduction mechanism, not secrecy.
  held_out_files:
    qoi: held_out/qoi.json
metrics:
  # Documentary only (agent-eval gates are qoi_complete + within_budget;
  # QoI accuracy is an ungated continuous score = -qoi_error). Tolerances
  # mirror the verified pipe_poiseuille V&V case: 10% relative on u_max,
  # 2e-3 m/s absolute on the zero-reference wall_u_avg (2% of U_mean).
  qoi_relative_tolerance:
    u_max: 0.10
  qoi_absolute_tolerance:
    wall_u_avg: 0.002
budget:
  # Evidence mode: the within_budget gate consumes the SELF-REPORTED
  # manifest timing.wall_time_sec (degraded, honesty-anchored semantics —
  # the judge never runs the solver). 3600 s is a deliberately generous
  # bound for a one-hour solver session; see card.yaml.
  max_runtime_sec: 3600
  max_cells: null
