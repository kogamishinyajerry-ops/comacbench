# Provenance declaration for pipe_from_brief (see src/cfdb/provenance/).
# honesty is NEVER declared here: it is derived mechanically by the audit.
citation: >-
  Hagen-Poiseuille closed-form solution for fully developed laminar pipe flow,
  u(r) = 2*U_mean*(1-(r/R)^2) with u_max = 2*U_mean (Hagen 1839; Poiseuille
  1840). Textbook statement: White, F. M., "Viscous Fluid Flow", 3rd ed.,
  McGraw-Hill, 2006, Ch. 3 — inherited from the verified source case
  cases/verification/pipe_poiseuille, whose task physics and docker-verified
  measurement this evidence-mode task reuses.
source_url: https://en.wikipedia.org/wiki/Hagen%E2%80%93Poiseuille_equation
retrieved: "2026-08-11"
transcription_verified: false
file_hashes:
  reference/compute_qoi.py: bdf40862beb1dce0f15ec42ef3bcef11591a35aa434b2a954922500eca5509e2
  reference/make_drawing.py: dbcb7482405b74bd5a4b5b8e7aa21567d87c5de5572803cd5ec1361364ea3fef
notes:
  - "Task physics (R=0.005 m, L=0.12 m, plug inlet U_mean=0.1 m/s, nu=5e-5,
    Re_D=20, transient to the developed parabolic profile) and the QoI
    definitions (u_max, wall_u_avg) are inherited from the VERIFIED case
    cases/verification/pipe_poiseuille; this task re-expresses that setup as
    a case_setup EVIDENCE-mode task: the agent sees only brief + drawing,
    drives any solver itself, and submits an evidence bundle."
  - "reference/compute_qoi.py keeps the source case's QoI semantics and
    re-expresses the input side against the solver-agnostic evidence
    contract (evidence/samples/profile.csv, header r,u, x=0.1 m station).
    The source case's documented sampling pit is turned into a contract
    anchor: interior line sampling on the coarse demo mesh extrapolates a
    spurious slip velocity at the wall (nearest-wall cell value 0.0099 m/s,
    ~10% of U_mean), so the profile's last row MUST be the wall boundary
    value at r=R (exactly 0 for a correct no-slip wall) and the frozen
    script enforces that endpoint. stdlib-only; runs on the HOST at scoring
    time."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
    (host-side matplotlib authoring tool, NOT part of the scoring path);
    every annotated dimension (R=0.005 m, L=0.12 m, U_mean=0.1 m/s, sample
    station x=0.1 m) matches the brief. English-only annotations so the
    asset renders identically without CJK fonts. The generator is anchored
    above so the frozen visible asset is re-derivable."
  - "held_out/qoi.json holds the SAME values the source case anchors
    (u_max=0.2 = 2*U_mean, wall_u_avg=0.0 — its held_out/qoi.json); no new
    digits were created here. The values are textbook-derivable, so
    anti-copy rests on the evidence-reduction mechanism (every scored number
    is recomputed from raw evidence by frozen code), not on secrecy."
  - "budget.max_runtime_sec=3600 is a deliberately generous bound: in
    evidence mode the within_budget gate consumes the SELF-REPORTED
    manifest timing.wall_time_sec (degraded, honesty-anchored semantics —
    the judge never runs the solver); 3600 s covers a one-hour interactive
    solver session with wide margin."
  - "E2E evidence (2026-08-11, ruler id 5f448677): the golden bundle was
    converted from the real docker run of the source case
    (runs/20260811T080645Z_pipe_poiseuille_openfoam_13984ed6,
    opencfd/openfoam-default:2312, blockMesh + icoFoam to t=1.0 s, 2400
    cells) by the witness converter agentbench/pipe_from_brief/make_golden.py
    — the x=0.1 m station profile is read off the final-time U field at
    cell column i_axial=100 (x=0.1005 m) of the single-block 120x20 wedge
    (cell ordering verified against blockMeshDict). Scored valid=true,
    score=-0.00165485: recomputed u_max=0.19933806 vs held-out 0.2
    (rel err 0.33097% — matching the source case's pinned measurement
    0.199338061 / 0.003309695) and wall_u_avg=0 (abs err 0); the aggregate
    mean over the two QoIs is 0.00165485. Negative control (profile u
    column scaled x1.2) scored valid=true, score=-0.0980142 (59x the golden
    error) — significantly worse, as designed. Witness material (contract,
    ledger, submissions, runs, converter) is kept under
    agentbench/pipe_from_brief/, outside the frozen case trees."
