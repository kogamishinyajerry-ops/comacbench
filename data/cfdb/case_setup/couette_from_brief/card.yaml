# Gallery card copy for couette_from_brief (cfdb showcase gallery).
# Case-root metadata OUTSIDE the frozen reference/visible trees:
# editing it never drifts a ruler (same discipline as provenance.yaml).
# Prose is grounded in this case's real files; structural facts
# (domain, gates, honesty, frozen status) are recomputed at render.
title: 从工程任务书搭建平面 Couette 剪切流算例(evidence 模式)
capability: case_setup 域 evidence 模式任务:agent 只拿到自然语言工程任务书(visible/task.md)和带尺寸标注的示意图
  (visible/drawing.png),在自己的环境里驱动任意求解器(Fluent、STAR-CCM+、自研、OpenFOAM 均可——judge 不运行任何求解器),
  提交证据包(manifest.json + 求解器原生日志 + 网格报告 + 壁到壁采样剖面 CSV)。物理:平面 Couette 流,间隙 H=0.01 m,
  上壁 U_lid=0.1 m/s,ν=5e-5 m²/s(Re_H=20),从静止瞬态积分到定常线性剖面。judge 校验证据包(required 文件齐备非空、
  manifest 可解析含 solver 字段、CSV 通用一致性),再由冻结脚本 reference/compute_qoi.py 从原始剖面归约
  bottom_wall_shear_normalized(静止壁斜率除以 U_lid/H)打分。
expected: 交一个证据包 submission/(布局 v1:manifest.json、evidence/solver.log、evidence/mesh_report.txt、
  evidence/samples/profile.csv,表头 y,u,首行 y=0 末行 y=H 的壁到壁锚定)。held_out 参考 1.0(解析值,线性剖面在任意网格
  上精确),案面无公开 qoi_values。黄金 E2E 已实证(2026-08-11,ruler 号 cd668504):golden 证据包由素材案例
  couette_shear 的真实 docker 重跑产物(run 20260811T094011Z,blockMesh+icoFoam 全程日志)转换而来,归约 QoI=1.0、
  qoi_error=0,与素材案例钉值(1.00000000、相对误差 0)一致,valid=true、score=0。
criteria: 冻结两门 AND:① qoi_complete——从证据归约出的 QoI 含声明 key(证据缺失、CSV 畸形、QoI 脚本失败均 fail-closed
  invalid);② within_budget——消费 manifest 自报的 timing.wall_time_sec ≤ 3600s(evidence 模式 budget 门基于自报墙钟,
  语义减弱、靠诚信与生产 harness 锚定,3600s 是宽松上限,缺失时退化为只管 judge 侧归约时钟并大声记录)。两门过才给连续分
  score=−qoi_error。每个被评分的数字都由冻结代码从原始证据重算,自报 QoI 不进入裁决。
what_makes_it_bite: 三个显式考点:(1) 证据合同要求剖面壁到壁锚定(首点 y=0、末点 y=H 由冻结脚本强制),静止壁端点必须取
  壁面边界值——无滑移写错或采样外插出滑移速度会直接扭斜底壁斜率;(2) 任务书求解器无关,Fluent 用户同样可读,不出现任何
  求解器专属字典名;(3) 负控实证(2026-08-11,ruler 号 cd668504):golden 剖面 u 列整体乘 1.2 后 valid=true 但
  score=−0.2(qoi_error 0.2,相对参考 1.0 差 20%),显著变差。残差:judge 无法证明求解器真跑过(证据模式固有,
  真实性由生产 harness 锚定);held_out 值 1.0 是教科书可推的解析值,anti-copy 依赖证据归约机制而非秘密数字。
