id: couette_from_brief
name: "Case Setup: Planar Couette Flow from Engineering Brief (evidence mode)"
category: case_setup
domain: case_setup
description: >-
  case_setup domain EVIDENCE-mode task: the agent receives only a
  natural-language engineering brief (visible/task.md) and an annotated
  dimensioned drawing (visible/drawing.png), then drives ANY CFD solver in
  its own environment (Fluent, STAR-CCM+, in-house code, OpenFOAM, ... —
  the judge runs NO solver at all) and submits an evidence bundle
  (manifest.json + solver-native log + mesh report + sampled profile). The
  judge validates the bundle (required files, manifest shape, generic CSV
  consistency) and recomputes the QoI from the raw evidence with the frozen
  script reference/compute_qoi.py on the host; a self-reported final QoI
  never enters the verdict. Task physics: planar Couette flow, gap H=0.01 m,
  top wall U_lid=0.1 m/s, nu=5e-5 m^2/s (Re_H=20), transient laminar from
  rest to the steady linear profile u(y)=U_lid*y/H. QoI
  bottom_wall_shear_normalized = (du/dy at the stationary wall)/(U_lid/H),
  held-out reference 1.0 (exact). Golden evidence is reduced from the
  verified docker run of cases/verification/couette_shear (measured QoI
  1.00000000, rel err 0.0); see provenance.yaml.
physics:
  flow: incompressible
  turbulence: none
  dimensionality: 2d
  steady: false
conditions:
  reynolds: 20.0
geometry:
  type: internal
  source: null
mesh:
  family: structured_hex
  levels: ["single"]
  target_y_plus: null
solvers:
  # Placeholder only: evidence mode runs NO solver on the judge — the
  # submission is an evidence bundle produced by the agent's own solver
  # environment; only the frozen QoI script executes (on the host).
  - name: generic
    command: "true"
execution:
  setup_mode: evidence
  evidence:
    required_files:
      - manifest.json
      - evidence/solver.log
      - evidence/mesh_report.txt
      - evidence/samples/profile.csv
    notes: >-
      Evidence bundle layout v1 (uniform across case_setup evidence tasks);
      per-file and per-column contract is documented in visible/task.md.
outputs:
  fields: ["U", "p"]
  curves: []
  qoi:
    - bottom_wall_shear_normalized
  qoi_script: reference/compute_qoi.py
reference:
  type: analytical
  # No public qoi_values: the ONLY scoring reference is the held-out copy.
  # The analytical value (1.0 for the linear profile on any mesh) is
  # textbook knowledge; even an agent that knows it must still submit
  # evidence from a real run whose recomputed QoI matches — the scored
  # number is reduced from the raw profile by frozen code, never taken
  # from the submission's hands.
  held_out_files:
    qoi: held_out/qoi.json
metrics:
  # Documentary only (agent-eval gates are qoi_complete + within_budget;
  # QoI accuracy is an ungated continuous score = -qoi_error). 1% mirrors
  # the verified couette_shear V&V tolerance for the same physics.
  qoi_relative_tolerance:
    bottom_wall_shear_normalized: 0.01
budget:
  # Evidence mode: the within_budget gate consumes the SELF-REPORTED
  # manifest timing.wall_time_sec (degraded, honesty-anchored semantics —
  # the judge never runs the solver). 3600 s is a deliberately generous
  # bound for a one-hour solver session; see card.yaml.
  max_runtime_sec: 3600
  max_cells: null
