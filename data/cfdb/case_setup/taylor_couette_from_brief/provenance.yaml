  - "reference/compute_qoi.py keeps the source case's reduction semantics
    (u_theta at the mid-gap radius, station must be a real sample point
    within 1e-6 m) and re-expresses the input side against the
    solver-agnostic evidence contract (evidence/samples/profile.csv, header
    r,u_theta, +x-ray sampling so the tangential component is the +y
    Cartesian component for ANY solver). stdlib-only; runs on the HOST at
    scoring time."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
    (host-side matplotlib authoring tool, NOT part of the scoring path);
    every annotated dimension (R_i=0.05 m, R_o=0.10 m, omega=1 rad/s,
    mid-gap station r=0.075 m) matches the brief. English-only annotations
    so the asset renders identically without CJK fonts. The generator is
    anchored above so the frozen visible asset is re-derivable."
  - "held_out/qoi.json holds the SAME value the source case anchors
    (0.01944444444444445, its held_out/qoi.json, emitted there by
    reference/generate.py from the closed form); no new digits were created
    here. The value is textbook-derivable, so anti-copy rests on the
    evidence-reduction mechanism (every scored number is recomputed from
    raw evidence by frozen code), not on secrecy of the number."
  - "budget.max_runtime_sec=3600 is a deliberately generous bound: in
    evidence mode the within_budget gate consumes the SELF-REPORTED
    manifest timing.wall_time_sec (degraded, honesty-anchored semantics —
    the judge never runs the solver); 3600 s covers a one-hour interactive
    solver session with wide margin."
