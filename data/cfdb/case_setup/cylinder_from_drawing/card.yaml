# Gallery card copy for cylinder_from_drawing (cfdb showcase gallery).
# Case-root metadata OUTSIDE the frozen reference/visible trees:
# editing it never drifts a ruler (same discipline as provenance.yaml).
# Prose is grounded in this case's real files; structural facts
# (domain, gates, honesty, frozen status) are recomputed at render.
title: "Case-Setup: Cylinder From Drawing (Re=40, Steady)"
capability: case_setup 域读图试点：agent 只拿到 visible/task.md（自然语言流动条件：U_inf=1 m/s、ν=0.025 m²/s、D 见图，
  推出 Re=40 定常层流）+ visible/drawing.png（标注图纸：圆柱 D=1 m 在原点、远场半径 R=50 m=50D、freestream/no-slip/empty
  边界、单位展长），需从零搭建完整 OpenFOAM 案例目录（0/ constant/ system/，O 型 blockMesh 网格、simpleFoam 层流、
  forceCoeffs1 函数对象），提交后评测在 --network none 沙箱里真实跑 blockMesh→求解器→冻结 QoI 脚本，提取阻力系数
  drag_coeff_cd 并逼近 Gautier, Biau & Lamballais (2013, Comput. Fluids 75) 伪谱参考解 Cd=1.49。
expected: 交完整 OpenFOAM 案例目录（不是 qoi.json——分数只能从真实求解器执行里出来）。冻结参考 Cd=1.49
  （held_out/qoi.json，与 cases/validation/cylinder_re40 同源同值；held_out 机制只证明冻结锚定通路，不宣称独立重算的
  anti-copy 价值）。golden 配置（cylinder_re40 的 0/constant/system 原样，blockMeshDict 按协议放到 system/ 下）
  2026-08-11 沙箱实测：simpleFoam 682 步收敛，Cd=1.5133，qoi_error=1.57%，valid=true——与该素材案例 A 轮实测
  1.513/1.6% 一致。
criteria: 冻结两门 AND：① qoi_complete——冻结 QoI 脚本必须能从 postProcessing/forceCoeffs1/<t>/coefficient.dat 末行
  解析出 drag_coeff_cd（任何一步失败——拷贝、blockMesh、求解器、QoI 脚本——都 fail-closed 无 QoI，门不过）；
  ② within_budget——backend 实测墙钟 ≤ 20s（golden 全协议实测约 8.1-8.7s，其中 solver 约 7.5s，留约 2.5 倍余量）。
  两门过才给连续分 score=−qoi_error（对 held_out 参考的相对误差）。⚠ QoI 准确度仍是 ungated 连续指标：case.yaml 的
  10% 容差只服务 V&V 路径，算得离谱只要流程跑通仍判 valid，只是分数难看。
what_makes_it_bite: 三个显式咬点：(1) 几何只在图纸上完整——task.md 不重复域尺寸，agent 必须从 drawing.png 读出
  R=50D 远场与单位展长，读错 D 会让 Cd 系统性偏离（负控实测：网格按 D=2 建、Aref 仍 1.0 时 Cd=2.355，
  qoi_error=58.1%，分数从 −0.0157 塌到 −0.581 但仍 valid——连续区分而非二元拒绝）；(2) QoI 提取约定靠 task.md 显式给出
  （函数对象名 forceCoeffs1、Aref=D×单位展长），不遵守则 QoI 脚本 fail-closed 无值、qoi_complete 不过判 invalid；
  (3) 远场边界若误用全场 fixedValue 会钉死出流侧尾迹、Cd 偏高——图纸标注 freestream 正是为了压住这类 blockage 误差
  （继承 cylinder_re40 的文档化领域决定）。
