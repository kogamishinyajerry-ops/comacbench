notes:
  - "Held-out and public reference value drag_coeff_cd=1.49 is the Gautier
    et al. (2013) reference-solution value, identical to
    cases/validation/cylinder_re40 (whose provenance records the two
    independent spot-check channels). Deliberately the SAME value in
    held_out and public qoi_values: the pilot proves the frozen-anchoring
    mechanism, not anti-copy independence."
  - "reference/compute_qoi.py is adapted from
    cases/validation/cylinder_re40/post/compute_qoi.py (authored in-repo),
    wake-length QoI dropped: the case_setup protocol runs blockMesh + the
    controlDict solver only, so the sampleDict wake line is never produced."
  - "reference/make_drawing.py is the generator of visible/drawing.png
    (matplotlib). Kept inside reference/ so the drawing's geometry spec is
    re-derivable and drift-anchored; it is authoring tooling, not a
    declared reference datum. All annotated dimensions (D=1 m, R=50 m,
    freestream/no-slip/empty boundaries, unit depth) match the golden
    geometry in cases/validation/cylinder_re40/constant/polyMesh/blockMeshDict."
  - "Golden runtime measured 2026-08-11 in the judge image
    (opencfd/openfoam-default:2312, --network none): simpleFoam converged
    in 682 SIMPLE iterations, ExecutionTime 7.15 s, Cd=1.5133 (1.57% vs
    1.49) — consistent with the cylinder_re40 A-round measurement
    (Cd 1.513 / 1.6%)."
