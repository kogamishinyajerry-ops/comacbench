    any solver itself, and submits an evidence bundle."
  - "held_out/qoi.json carries the source case's anchored held-out value
    1.640526 verbatim (number discipline: no newly minted reference
    numbers). The value is textbook-derivable, so anti-copy does NOT rest
    on secrecy of the number: it rests on the evidence mechanism — the
    scored QoI is recomputed by the frozen script from the submitted raw
    Mach profile, never taken from a self-reported final value."
  - "reference/compute_qoi.py adapts the reduction logic of the source
    case's post/compute_qoi.py to the evidence format: instead of parsing
    OpenFOAM probe files it reads evidence/samples/mach_profile.csv
    (y,mach), sorts/dedups stations, and linearly interpolates to the same
    QoI probe height y=0.15 m on the x=0.6 m cut. stdlib-only per the
    qoi_script contract; runs on the HOST at scoring time."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
    (host-side matplotlib authoring tool, NOT part of the scoring path);
    every annotated number (domain 1.0x0.8 m, apex (0.2, 0), theta=10 deg,
    beta=39.31384 deg, sampling line x=0.6 m, probe y=0.15 m) matches the
    brief and the source case geometry. Labels are English/ASCII to avoid
    CJK font glyph gaps. The generator is kept in-tree under reference/ so
    the frozen visible asset is re-derivable."
  - "budget.max_runtime_sec=3600 is deliberately loose: in evidence mode
    the judge runs no solver, so the within_budget gate is backed by the
    SELF-REPORTED timing.wall_time_sec in manifest.json (degraded
    semantics vs managed mode, loudly noted by the scorer); absent a
    self-report it degenerates to gating only the host-side reduction
    clock. The 3600 s figure bounds the reduction step with a wide margin."
  - "E2E evidence (2026-08-11, ruler #ade55077): the golden evidence bundle
    was converted from the source case's real docker run artifacts
    (runs/20260811T080830Z_oblique_shock_openfoam_4f1d4e2c; converter kept
