# honesty is NEVER declared here: it is derived mechanically by the audit.
citation: >-
  Moser, R. D., Kim, J., Mansour, N. N., "Direct numerical simulation of
  turbulent channel flow up to Re_tau=590", Physics of Fluids 11(4),
  pp. 943-945, 1999 (Re_tau=180 case; data file chan180.means from the
  authors' official turbulence fileserver, UT Austin) — inherited from
  cases/validation/turbulent_channel_retau180, whose docker-verified
