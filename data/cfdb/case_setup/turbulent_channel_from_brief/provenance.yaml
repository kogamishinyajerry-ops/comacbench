source_url: https://turbulence.oden.utexas.edu/data/MKM/chan180/profiles/chan180.means
retrieved: "2026-08-11"
transcription_verified: true
file_hashes:
  reference/compute_qoi.py: 320605ba3562b34ab6190f45df07810e60d4c87867e58427bd69e97d9ee2f340
  reference/make_drawing.py: 36305797a85fc5418399f53e20cc646f656ecf0f1a0a228b1451ba7a45812221
notes:
  - "Task physics and golden measurement are inherited from the VALIDATION
    case cases/validation/turbulent_channel_retau180 (held-out reference
    Cf = 8.18e-3, the published MKM1999 value; 2026-08-11 docker run
    20260811T080830Z_turbulent_channel_retau180_openfoam_155d6d60 on
    opencfd/openfoam-default:2312 measured cf_bulk = 7.842e-3, 4.13% low,
    on the 2048-cell demo mesh). This task re-expresses that validated
    setup as a case_setup EVIDENCE-mode task: the agent sees only the
    brief + drawing, drives its own solver, and submits an evidence
    bundle."
  - "reference/compute_qoi.py is a NEW reduction script for the evidence
    bundle format (evidence/samples/wall_shear.csv: header
    'surface,tau_w_x_pa', both channel walls required), NOT a copy of the
    source case's post/compute_qoi.py (which parses OpenFOAM's native
    wallShearStress field — solver-specific and therefore unusable for a
    solver-neutral evidence contract). The QoI definition is identical:
    Cf = mean(|tau_w,x|) / (0.5*rho*U_b^2) with rho = 1, U_b = 1.
    stdlib-only per the qoi_script contract; runs on the HOST at scoring
    time."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
    (host-side matplotlib authoring tool, NOT part of the scoring path);
    every annotated dimension (2h = 2 m, Lx = 2*pi*h, Lz = pi*h,
    U_b = 1 m/s, nu = 3.571429e-4 m^2/s) matches the brief. The generator
    is kept in-tree under reference/ so the frozen visible asset is
    re-derivable; it is anchored above and by the contract manifest."
  - "held_out/qoi.json holds the published MKM1999 Cf = 8.18e-3, the ONLY
    scoring reference (case.yaml declares no public qoi_values). The value
    is literature knowledge and the brief names the DNS source, so
    anti-copy does NOT rest on secrecy of the number: it rests on the
    evidence-bundle contract — every scored number is recomputed from raw
    solver evidence by the frozen script, and fabrication requires faking
    a full set of solver-native artifacts (log with residual history,
    mesh report, self-consistent wall-shear samples on both walls)."
  - "budget.max_runtime_sec=3600 is deliberately loose: in evidence mode
    the judge runs no solver, so the within_budget gate only consumes the
    submission's SELF-REPORTED manifest timing.wall_time_sec (semantics
    degraded by design, loudly noted by the scorer); the same value also
    caps the host-side QoI reduction step."
  - "E2E evidence (2026-08-11, ruler #db76bc89): golden evidence bundle
    (mechanically converted from the real docker run
    20260811T080830Z_turbulent_channel_retau180_openfoam_155d6d60 by
    agentbench/turbulent_channel_from_brief/make_golden_evidence.py)
    scored valid=true, score=-0.0412936 — computed cf_bulk
    7.842218e-3 vs held-out 8.18e-3, 4.13%, matching the source case's
    pinned measurement exactly. Negative controls: wall-shear samples
    scaled x1.5 scored valid=true but score=-0.43806 (43.8% error, 10x
    worse); deleting all 'upper' wall samples scored valid=false
    (frozen script exit 1, fail-closed). Witness submissions and run
    artifacts are kept under agentbench/turbulent_channel_from_brief/
    (submissions/, runs/, ledger.jsonl), outside the frozen case trees."
