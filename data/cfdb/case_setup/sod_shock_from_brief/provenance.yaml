notes:
  - "Task physics is inherited verbatim from the VERIFIED case
    cases/verification/sod_shock_tube (tube x in [0,1] m, diaphragm at
    x=0.5, gamma=1.4 exactly, left (p,rho)=(1 Pa, 1 kg/m^3), right
    (0.1 Pa, 0.125 kg/m^3), both at rest, inviscid compressible Euler,
    evaluation at t=0.2 s). That case's 2026-08-11 full docker run on
    opencfd/openfoam-default:2312 measured shock_x_t02=0.85 (0.051%
    error) and rho_plateau_t02=0.42631711 (0.0005% error) on the
    1000-cell mesh with vanLeer shock capturing. This task re-expresses
    that verified setup as a case_setup EVIDENCE-mode task: the agent
    sees only the brief + drawing, drives its own solver, and submits an
    evidence bundle (layout v1 documented in visible/task.md)."
  - "reference/compute_qoi.py keeps the source case's frozen extraction
    conventions (post/compute_qoi.py), made mesh-agnostic for arbitrary
    submitted profiles: shock_x_t02 = midpoint of the consecutive sample
    pair with the largest density jump (on a uniform cell-centred grid
    this is exactly the source script's (i_shock+1)*dx), and
    rho_plateau_t02 = rho of the sample nearest x=0.6. stdlib-only; runs
    on the HOST on the submission directory."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
    (host-side matplotlib authoring tool, NOT part of the scoring path);
    every annotated number (L=1 m, diaphragm x=0.5, p/rho states,
    gamma=1.4, t=0.2 s, probe x=0.6) matches the brief and the golden
    source configuration. English-only annotations avoid CJK glyph
    issues. The generator is kept in-tree under reference/ so the frozen
    visible asset is re-derivable."
  - "held_out/qoi.json holds the exact Riemann values at t=0.2 s
    (shock_x_t02=0.8504311464060357, rho_plateau_t02=0.4263194281784952),
    byte-identical to the source case's anchored held_out/qoi.json — no
    new numbers were created for this task. The values are
    recomputable by anyone (Sod 1978), so anti-copy does NOT rest on
    secrecy: every scored number is recomputed from the raw submitted
    profile by the frozen script — a self-reported final QoI never
    enters the verdict. Run authenticity is NOT proven by the judge
    (evidence mode by design); it is anchored by the production harness
    driving the agent live."
  - "budget.max_runtime_sec=3600 is deliberately loose: in evidence mode
    the judge never runs the solver, so the budget gates (a) the
    host-side QoI reduction timeout and (b) the within_budget gate on the
    SELF-REPORTED manifest timing.wall_time_sec — degraded gate semantics
    versus managed mode (it gates a self-reported number, not a
    backend-measured one; when absent, only the reduction clock is gated
    and the scorer notes the degradation loudly). The golden OpenFOAM
    run solves in ~1 s, so 3600 s is headroom for arbitrary external
    solvers."
  - "E2E evidence (2026-08-11, ruler #d02d6d37): the golden bundle was
    converted from the verified source run
    runs/20260811T080807Z_sod_shock_tube_openfoam_9e9b2f7a by
    agentbench/sod_shock_from_brief/make_golden_evidence.py (witness,
    outside the frozen trees) — t=0.2 s rho field at the 1000 cell
    centres plus verbatim solver/blockMesh logs. It scored valid=true,
    score=-0.000256206 (shock_x=0.85 vs held-out 0.85043115, 0.051%;
    rho_plateau=0.42631711 vs 0.42631943, 0.0005% — both matching the
    source case's pinned measurements exactly). Negative controls:
    perturbing every density value by 15% scored valid=true with
    score=-0.0752504 (uniform scaling preserves the max-gradient shock
    locator, so the degradation is carried by the plateau density — the
    continuous score tracks the perturbation as designed); deleting
    evidence/samples/density_profile.csv scored valid=false (fail-closed
    on a missing required file). Witness submissions, the converter and
    run artifacts are kept under agentbench/sod_shock_from_brief/
    (submissions/, runs/, ledger.jsonl)."
