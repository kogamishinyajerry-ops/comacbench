# Provenance declaration for sod_shock_from_brief (see src/cfdb/provenance/).
# honesty is NEVER declared here: it is derived mechanically by the audit.
citation: >-
  Sod, G. A., "A Survey of Several Finite Difference Methods for Systems
  of Nonlinear Hyperbolic Conservation Laws", J. Comput. Phys. 27:1-31,
  1978 (shock-tube exact Riemann solution, gamma=1.4; universally
  tabulated values p*=0.30313, u*=0.92745, rho*_L=0.42632) — inherited
  from the VERIFIED case cases/verification/sod_shock_tube, whose held-out
  values were computed pointwise by its frozen generate_reference.py
  (Newton iteration for p*, no hand-typed numbers) and cross-checked
  against the tabulated Sod values, and whose task physics and
  docker-verified measurement this evidence-mode task reuses.
