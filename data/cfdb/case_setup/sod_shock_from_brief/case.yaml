id: sod_shock_from_brief
name: "Case Setup: Sod Shock Tube from Engineering Brief (evidence mode)"
category: case_setup
domain: case_setup
description: >-
  case_setup domain EVIDENCE-mode task: the agent receives only a
  natural-language engineering brief (visible/task.md) and an annotated
  dimensioned drawing (visible/drawing.png), drives an ARBITRARY solver
  in its own environment (the judge has NO solver), and submits an
  evidence bundle (manifest.json + raw solver log + mesh report +
  density-profile CSV at t = 0.2 s). The judge validates the bundle and
  the frozen QoI script reference/compute_qoi.py reduces shock_x_t02
  (shock position = midpoint of the sample pair with the largest density
  jump) and rho_plateau_t02 (density at the star-region probe x = 0.6)
  on the host. Task physics: Sod (1978) shock tube, inviscid
  compressible Euler, 1D tube x in [0, 1] m, diaphragm at x = 0.5,
  gamma = 1.4 exactly, left state (p, rho) = (1 Pa, 1 kg/m^3), right
  state (0.1 Pa, 0.125 kg/m^3), both at rest. Held-out reference QoI =
  exact Riemann solution at t = 0.2 s (shock at 0.8504311464060357,
  star-region density 0.4263194281784952). Golden measurement inherited
  from the VERIFIED case cases/verification/sod_shock_tube (2026-08-11
  docker run measured shock_x_t02 = 0.85, rho_plateau_t02 = 0.42631711);
  see provenance.yaml.
physics:
  flow: compressible
  turbulence: none
  # Effectively 1D (empty patches in the source case); declared 2d like
  # the source case (the schema has no '1d').
  dimensionality: 2d
  steady: false
conditions:
  # Inviscid Euler: no Reynolds number. Mach is not a free parameter
  # (both states at rest; wave speeds follow from the pressure ratio).
  reynolds: null
  mach: null
geometry:
  type: internal
  source: null
mesh:
  family: structured_hex
  levels: ["single"]
  target_y_plus: null
solvers:
  # Placeholder only: evidence mode runs NO solver on the judge — the
  # scored numbers are reduced from the submitted evidence bundle by the
  # frozen QoI script on the host.
  - name: generic
    command: "true"
execution:
  setup_mode: evidence
  evidence:
    required_files:
      - manifest.json
      - evidence/solver.log
      - evidence/mesh_report.txt
      - evidence/samples/density_profile.csv
    notes: >-
      Evidence bundle layout v1; per-file per-column formats are
      documented in visible/task.md (the agent-readable surface).
outputs:
  fields: ["rho", "U", "p", "T"]
  curves: []
  qoi:
    - shock_x_t02
    - rho_plateau_t02
  qoi_script: reference/compute_qoi.py
reference:
  type: analytical
  # No public qoi_values: the ONLY scoring reference is the held-out copy
  # (Sod 1978 exact Riemann solution at t=0.2, gamma=1.4, computed
  # pointwise by the source case's frozen generate_reference.py). The
  # scored numbers are always recomputed from the submitted raw profile
  # by the frozen script, never self-reported.
  held_out_files:
    qoi: held_out/qoi.json
metrics:
  # Documentary only (agent-eval gates are qoi_complete + within_budget;
  # QoI accuracy is an ungated continuous score = -qoi_error). 2%/5%
  # mirror the verified sod_shock_tube tolerances for the same physics
  # (shock-capturing smearing on a 1000-cell demo mesh).
  qoi_relative_tolerance:
    shock_x_t02: 0.02
    rho_plateau_t02: 0.05
budget:
  # Evidence mode: the judge never runs the solver, so this budget gates
  # (a) the host-side QoI reduction timeout and (b) the within_budget gate
  # on the SELF-REPORTED manifest timing.wall_time_sec — degraded gate
  # semantics by design (see card.yaml). 3600 s is a deliberately loose
  # ceiling for an arbitrary external solver on this problem (the golden
  # OpenFOAM run solves in ~1 s).
  max_runtime_sec: 3600
  max_cells: null
