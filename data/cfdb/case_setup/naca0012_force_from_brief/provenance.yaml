    at least 5 rows). It does NOT parse any solver-native format — the
    evidence contract is solver-neutral by design. stdlib-only per the
    qoi_script contract; runs on the HOST at scoring time."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
