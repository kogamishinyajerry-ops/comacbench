    the airfoil contour uses the closed-form NACA 4-digit thickness
    equation (the same profile as the source case's geometry file), and
    every annotated number (c = 1 m, U_inf = 100 m/s, nu = 1.6667e-5
    m^2/s, alpha = 0) matches the brief. The generator is kept in-tree
    under reference/ so the frozen visible asset is re-derivable."
  - "held_out/qoi.json holds the Ladson 1988 values cl = 0.0 / cd =
    0.0086, the ONLY scoring reference (case.yaml declares no public
    qoi_values). The values are literature knowledge and the brief names
    the source, so anti-copy does NOT rest on secrecy of the numbers: it
    rests on the evidence-bundle contract — every scored number is
    recomputed from the raw force history by the frozen script, and
    fabrication requires faking a full set of solver-native artifacts
    (log with residual history, mesh report, self-consistent convergence
    history)."
  - "budget.max_runtime_sec=3600 is deliberately loose: in evidence mode
