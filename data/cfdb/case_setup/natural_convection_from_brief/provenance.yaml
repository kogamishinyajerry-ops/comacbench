notes:
  - "Task physics and the held-out QoI anchor are inherited from the
    VALIDATED case cases/validation/natural_convection_cavity (de Vahl
    Davis 1983 hot-wall average Nu=2.238 at Ra=1e4, cross-checked against
    >=2 independent reproductions per the source case's provenance; the
    Ra=1e4 wall-average/mid-plane pair 2.238/2.243 definitional trap is
    documented there — this case anchors the WALL average).
    held_out/qoi.json is a verbatim copy of the source case's
    held_out/qoi.json — no new reference number was created."
  - "This case re-expresses that validation setup as a case_setup
    EVIDENCE-mode task: the agent sees only the solver-neutral brief +
    drawing, drives any solver off-judge, and submits an evidence bundle
    (layout v1: manifest.json, evidence/solver.log, evidence/mesh_report.txt,
    evidence/samples/hot_wall_flux.csv). The judge runs no solver; the
    frozen reference/compute_qoi.py (stdlib-only, host-side) validates the
    sample layout (header exactly y,q; y strictly increasing in [0, 1] m,
    uniform spacing within 5% of the mean — equal-height strips so the
    plain average IS the area average; full-height coverage; >= 16
    stations) and reduces hot_wall_nu_avg = mean(|q|)*H/(k*dT) =
    mean(|q|)/64.37 — the SAME definition as the source case's QoI."
  - "visible/drawing.png is MACHINE-GENERATED by reference/make_drawing.py
    (host-side matplotlib authoring tool, NOT part of the scoring path);
    every annotated dimension (H=1 m, T_hot=293 K, T_cold=283 K, g,
    Pr/Ra) matches the brief. The generator is kept in-tree under
    reference/ so the frozen visible asset is re-derivable; it is anchored
    above and by the contract manifest. System python3 matplotlib was
    used (the cfdb uv env ships no matplotlib); the generator is not part
    of any judged path."
  - "budget.max_runtime_sec=3600 is a deliberately generous envelope: in
    evidence mode the within_budget gate consumes the SELF-REPORTED
    manifest timing.wall_time_sec (weakened semantics — the judge never
    clocks the solver run; when undeclared the gate degrades to the
    judge-side reduction clock and the notes say so loudly). Buoyancy-
    driven SIMPLE converges slowly in general; the golden docker run
    measured 10.9 s wall."
  - "Golden E2E (2026-08-11, ruler #24e1ac04): the golden evidence bundle
    was CONVERTED from the source case's real docker run
    runs/20260811T080807Z_natural_convection_cavity_openfoam_41a6985f
    (buoyantSimpleFoam + Boussinesq, 4096 cells,
    opencfd/openfoam-default:2312 @ sha256:097e45046a74, SIMPLE converged
    in 1169 iterations, wall 10.89 s) by the witness converter
    agentbench/natural_convection_from_brief/make_golden_evidence.py
    (solver.log <- log.solve verbatim, mesh_report.txt <- log.block_mesh
    verbatim, hot_wall_flux.csv <- final-time wallHeatFlux hotWall patch,
    64 uniform faces at y_j=(j+0.5)/64 m). Scored valid=true,
    score=-0.00131801 (computed 2.2350502934693957 vs held-out 2.238,
    0.13% — bit-identical to the source case's docker-verified
    measurement). Station sanity: max|q| at y/H=0.148 (literature nu_max
    at 0.143), min|q| at the wall top (literature nu_min at y/H=1).
    Witness bundle, ledger and run artifacts are kept under
    agentbench/natural_convection_from_brief/ (submissions/, runs/,
    ledger.jsonl), outside the frozen case trees."
  - "Negative control E2E (2026-08-11, same ruler): hot_wall_flux.csv
    with q scaled by 1.3 scored valid=true, score=-0.298287 (computed
    2.9056, error 29.8% vs golden 0.13%) — the continuous score
    discriminates flux scaling as designed."
  - "Trust posture (inherited from the evidence-mode scorer): this verdict
    validates the bundle and recomputes the QoI from raw evidence; it does
    NOT prove a solver actually ran. The held-out value is a published
    literature number, so anti-copy rests on the bundle contract
    (fabrication requires faking a full solver-native artifact set) and on
    the production harness that drives the agent live — never on secrecy
