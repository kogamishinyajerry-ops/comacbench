      \  # Signal loss coefficient in 1/m\ngamma_s = 0.82  # Fraction of the signal\
      \ mode overlap with the ions\ngamma_p = 0.0024  # Fraction of the pump mode\
      \ overlap with the ions\nR1 = 0.99  # Reflectivity of the input mirror\nR2 =\
      \ 0.035  # Reflectivity of the output mirror\nL = 40  # Fiber length in meters\n\
      Ppl = 50 # Left pump power in watts\nPpr = 50  # Right pump power in watts\n\
      c = 3e8  # Speed of light in m/s\nh = 6.626e-34  # Planck's constant in J*s\n\
      nu_s = c / lambda_s\nnu_p = c / lambda_p\n# Define functions to calculate saturation\
      \ powers\ndef calculate_Pssat(h, nu_s, A_c, gamma_s, sigma_es, sigma_as, tau):\n\
      \    \"\"\"Calculate saturation power for the signal.\n    Uses the Planck's\
      \ constant, frequency of the signal, core area, overlap of the signal with the\
      \ ions,\n    emission and absorption cross-sections, and the lifetime of the\
      \ excited state.\"\"\"\n    Pssat = h * nu_s * A_c / (gamma_s * (sigma_es +\
      \ sigma_as) * tau)\n    return Pssat\ndef calculate_Ppsat(h, nu_p, A_c, gamma_p,\
      \ sigma_ep, sigma_ap, tau):\n    \"\"\"Calculate saturation power for the pump.\"\
      \"\"\n    Ppsat = h * nu_p * A_c / (gamma_p * (sigma_ep + sigma_ap) * tau)\n\
      \    return Ppsat\n# Calculate saturation powers\nPssat = calculate_Pssat(h,\
      \ nu_s, A_c, gamma_s, sigma_es, sigma_as, tau)\nPpsat = calculate_Ppsat(h, nu_p,\
      \ A_c, gamma_p, sigma_ep, sigma_ap, tau)\nz = np.linspace(0, L, 10)\ny_guess\
