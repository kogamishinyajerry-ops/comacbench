    - "'''\nThis function computes the conserved total eenrgy for N particles interacting\
      \ via gravity only.\nInputs:\nuin: a 2D array of initial positions and velocities.\
      \ N,6 elements; each element is a float; each particle is described by its location\
      \ and velocity, first the $x$,$y$,$z$ position of the particle followed by the\
      \ $vx$,$vy$,$vz$ velocity of the partile. Thus particle \"i\"'s position and\
      \ velocity are stored in uin[i][0],uin[i][1],uin[i][2],uin[i][3],uin[i][4],uin[i][5].\n\
      mass: an 1D array of particle masses; an array of floats\nOutputs:\nEtot: the\
      \ conserved total energy, float\n'''\ndef Nbody_Etot(uin, mass):\n    Ekin =\
      \ 0.5*np.sum(mass * (uin[:,3]**2 + uin[:,4]**2 + uin[:,5]**2))\n    # this is\
      \ horrible, but somewhat close to the naive expression given above\n    ggrav\
      \ = 6.67430e-11\n    Epot = 0.\n    for i in range(len(mass)):\n        for\
      \ j in range(i+1, len(mass)):\n            rij = np.sqrt((uin[i,0] - uin[j,0])**2\
      \ + (uin[i,1] - uin[j,1])**2 + (uin[i,2] - uin[j,2])**2)\n            Epot +=\
      \ -2. * ggrav * mass[i] * mass[j] / rij\n    Etot = Ekin + Epot\n    return\
      \ Etot\n# mass of Sun and Earth\nmass = np.array([1.98855e30, 5.97219e24])\n\
      # initial position and velocity (Sun at origin and at rest, Earth velocity along\
      \ y axis)\nuin = np.array([[0.,0.,0.,\n                 0.,0.,0.],\n       \
      \         [1.49598261e11,0.,0.,\n                 0.,29.78e3,0.]])\nt0 = 0.\n\
      t1 = 365.*24.*60.*60. # 1 year\ndt = 60.*60.          # 1 hour\nNbody(uin, mass,\
      \ dt, t0, t1)\nEtot0 = Nbody_Etot(uin, mass)\nuout = Nbody(uin, mass, dt, t0,\
      \ t1)\nEtot1 = Nbody_Etot(uout, mass)\nassert (np.isclose(Etot0, Etot1)) ==\
      \ target"
