      assert np.allclose(ghz_protocol_fidelity(ghz,dephasing), target)"
    - "ghz = np.zeros(16); ghz[0]=1/np.sqrt(2); ghz[-1]=1/np.sqrt(2); ghz = np.outer(ghz,ghz)\n\
