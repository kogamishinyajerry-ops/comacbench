    - 'np.random.seed(1)

      N = 50

      T = 1.5

      num_steps = 1000

      spins = np.random.choice([-1, 1], size=N)

      J = np.random.randn(N, N)

      J = (J + J.T) / 2  # Make symmetric

      np.fill_diagonal(J, 0)  # No self-interaction

      J = J / np.sqrt(N)

      spins = find_equilibrium(spins, N, T, J, num_steps)

      assert np.allclose(spins, target)'
    - 'np.random.seed(2)

