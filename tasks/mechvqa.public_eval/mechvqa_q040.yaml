  reference_answer: 在参数表中，当 l₁ 的标称尺寸为 48 时，Type EH 的 m₁ 为 31 ± 0.25，m₂ 为 30.5 ± 0.25。两者相加的标称尺寸为
    31 + 30.5 = 61.5。根据公差叠加原则，最大可能值为 (31 + 0.25) + (30.5 + 0.25) = 62，最小可能值为 (31 - 0.25) + (30.5 - 0.25) = 61。因此，m₁
    与 m₂ 尺寸之和的公差范围为 61 ~ 62，即 61.5 ± 0.5。
