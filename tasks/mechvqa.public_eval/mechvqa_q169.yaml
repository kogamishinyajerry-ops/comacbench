  question_index: 1127
  reference_answer: '根据机械图纸的中间侧视图以及图纸下方的参数表格，当 l₁=270 mm、l₂=27 mm 时，链条总长度中包含 **10
    个滚轮单元**。


    **计算依据**：

    1. 参数表格中对应 l₁=270 mm、l₂=27 mm 的行明确标注 “Rollers per track = 10”。

    2. 中间侧视图显示链条为单轨道结构，滚轮单元沿链条长度方向连续排列，因而该数值直接代表链条总长度内的滚轮单元数量。

    3. 若使用链长公式 l₁ = (滚轮单元数 × 单元宽度) + 2×l₃（其中 d=25 mm 为单元宽度，l₃=13.5 mm），代入 10 个单元得到
    277 mm，略高于标注的 270 mm，属于设计公差或四舍五入误差，不影响表格中给出的 10 个滚轮单元的结论。


    因此，答案为 **10 个滚轮单元**。'
