    \  \n3. **轴测图**：图纸右下角的三维立体图，以轴测投影方式直观呈现零件整体形状，属于轴测图（用于辅助理解零件空间结构）。  \n\n综上，该图纸采用的特殊视图包括剖视图、向视图和轴测图。"
