  reference_answer: '根据机械图纸表格，当 d₁ 为 25 ± 0.1 且 Magnet HF 为 M4 时，h 尺寸标注为 7 +0.3/‑0.2。由此可得：

    - 基准尺寸：7 mm

    - 上偏差：+0.3 mm → 最大极限尺寸 = 7 mm + 0.3 mm = 7.3 mm

    - 下偏差：‑0.2 mm → 最小极限尺寸 = 7 mm – 0.2 mm = 6.8 mm


    因此，h 尺寸的公差范围为 **6.8 mm 至 7.3 mm**（单位：mm）。'
